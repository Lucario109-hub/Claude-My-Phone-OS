    if(/(wer bist du|wie heißt du|was bist du)/.test(l))return C('Ich bin LucarioBot, der Assistent von LucarioNet. Ohne KI-Server arbeite ich regelbasiert direkt auf deinem Gerät – nichts verlässt dein Handy. Mit einem KI-Server kann ich frei antworten.');
    if(/(wie spät|uhrzeit|wieviel uhr|wie viel uhr)/.test(l))return C('Es ist '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' Uhr.');
    if(/(welcher tag|welches datum|datum|wochentag|den wievielten)/.test(l))return C('Heute ist '+new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'.');
    const tm=l.match(/timer.*?(\d+)\s*(sekunden?|sek|s|minuten?|min|m|stunden?|std|h)\b/)||l.match(/(\d+)\s*(sekunden?|sek|minuten?|min|stunden?|std)\b.*timer/);
    if(tm){const n=+tm[1],u=tm[2][0],ms=u=='s'?n*1000:(u=='m'?n*60000:n*3600000);if(n>0&&ms<=86400000){Sys.unlock();Sys.timer={end:Date.now()+ms};return C('⏲ Timer gestellt: '+n+' '+tm[2]+'. Ich melde mich, wenn er abläuft.')}}
    const wk=l.match(/wecker.*?(\d{1,2})(?:[:.](\d{2}))?\s*(?:uhr)?/);
    if(wk&&+wk[1]<24){const hm=String(+wk[1]).padStart(2,'0')+':'+String(+(wk[2]||0)).padStart(2,'0');let al=[];try{al=JSON.parse(LS.alarms||'[]')}catch(e){}al.push({time:hm,on:1,label:'LucarioBot'});LS.alarms=JSON.stringify(al);return C('⏰ Wecker für '+hm+' Uhr gestellt.')}
    const cv=this.calc(q);if(cv!==null)return C('= '+String(cv).replace('.',','));
    if(/(dunkelmodus|nachtmodus|dark mode|dunkles design|dunkel)/.test(l)&&short){SET.theme='dark';saveSet();applySet();return C('🌙 Dunkelmodus ist an.')}
    if(/(hellmodus|lichtmodus|hell mode|helles design|tagmodus|^hell$|modus hell)/.test(l)&&short){SET.theme='light';saveSet();applySet();return C('☀️ Hellmodus ist an.')}
    if(/(automatischer? modus|design automatisch|theme auto)/.test(l)){SET.theme='auto';saveSet();applySet();return C('🌓 Das Design folgt jetzt dem System.')}
    if(/(ton aus|stumm|lautlos)/.test(l)){SET.sound=0;saveSet();return C('🔕 Ton ist aus.')}
    if(/(ton an|ton ein|ton aktivieren)/.test(l)){SET.sound=1;saveSet();return C('🔔 Ton ist an.')}
    if(/vibration (aus|ausschalten)/.test(l)){SET.vibrate=0;saveSet();return C('Vibration ist aus.')}
    if(/vibration (an|ein)/.test(l)){SET.vibrate=1;saveSet();return C('📳 Vibration ist an.')}
    if(/(sperr(e|en) (das )?(handy|gerät|display)|bildschirm sperren|^sperren$)/.test(l)){setTimeout(()=>{closeApp(true);Lock.show()},400);return C('🔒 Ich sperre das Gerät.')}
    const op=q.match(/^(?:öffne|öffnen|starte|starten|zeig(?:e)? mir|geh zu|gehe zu|mach|mache|open)\s+(.+)/i);
    if(op){
      const r=this.findApp(op[1]);
      if(r&&r.app){setTimeout(()=>openApp(r.app.id),300);return C('Ich öffne '+r.app.name+' …')}
      if(r&&r.store)return C(r.store.name+' ist noch nicht installiert. Du findest es im App Store.',[['🛍 App Store öffnen',()=>openApp('store')]]);
    }
    if(/(wlan|wifi|w-lan|netzwerk|internet)\b/.test(l)&&!/(suche|such)\s/.test(l)){setTimeout(()=>Net.open(),300);return C('📶 Ich öffne das WLAN-Menü. Status: '+Net.text()+'.')}
    const nt=q.match(/^(?:notiz|merk dir|merke dir|erinnere mich(?: an)?)[:\s]+(.+)/i);
    if(nt){let n=[];try{n=JSON.parse(LS.notes||'[]')}catch(e){}n.push({id:Date.now(),title:nt[1].slice(0,40),text:nt[1],t:Date.now()});LS.notes=JSON.stringify(n);return C('📝 Notiz gespeichert: „'+nt[1]+'“',[['Notizen öffnen',()=>openApp('notes')]])}
    const td=q.match(/^(?:aufgabe|to-?do)[:\s]+(.+)/i);
    if(td){let a=[];try{a=JSON.parse(LS.todos||'[]')}catch(e){}a.push({id:Date.now(),text:td[1],done:0});LS.todos=JSON.stringify(a);return C('✅ Aufgabe hinzugefügt: „'+td[1]+'“')}
    if(/(meine|zeig).*(aufgaben)/.test(l)){let a=[];try{a=JSON.parse(LS.todos||'[]')}catch(e){}a=a.filter(x=>!x.done);return C(a.length?'Offene Aufgaben:\n'+a.map(x=>'• '+x.text).join('\n'):'Du hast keine offenen Aufgaben. 🎉')}
    if(/(meine|zeig).*(notizen)/.test(l)){let n=[];try{n=JSON.parse(LS.notes||'[]')}catch(e){}return C(n.length?'Deine Notizen:\n'+n.slice(-8).map(x=>'• '+(x.title||'Ohne Titel')).join('\n'):'Du hast noch keine Notizen.',[['Notizen öffnen',()=>openApp('notes')]])}
    const ca=l.match(/(?:ruf|rufe|wähle|anruf)\w*\s+([+\d][\d\s+().-]{5,})/);
    if(ca){const n=normPhone(ca[1]);if(n){const o=await phoneOwner(n);setTimeout(()=>Sys.outgoing(o?o.name+' ('+n+')':n),300);return C('📞 Ich rufe '+(o?o.name+' ('+n+')':n)+' an. (Anrufe sind in LucarioNet simuliert.)')}}
    const se=q.match(/^(?:suche|such|google|recherchiere)\s+(?:nach\s+)?(.+)/i);
    if(se){Sys.pendingUrl=se[1];setTimeout(()=>openApp('browser'),300);return C('🔎 Ich suche im Browser nach „'+se[1]+'“.')}
    if(/(akku|batterie|speicher|status|systeminfo|systeminformationen)/.test(l))return C(await this.status());
    if(/(witz|lach)/.test(l))return C(this.jokes[Math.random()*this.jokes.length|0]);
    if(/würfel/.test(l))return C('🎲 Du hast eine '+(1+Math.random()*6|0)+' gewürfelt.');
    if(/(münze|kopf oder zahl)/.test(l))return C('🪙 '+(Math.random()<.5?'Kopf':'Zahl')+'!');
    if(/(zufallszahl)/.test(l))return C('🎯 '+(1+Math.random()*100|0));
    if(/(support|ticket|kundendienst)/.test(l))return C('Im Support kannst du Probleme melden und die Sofort-Hilfe bei gestohlenen Daten starten.',[['🛟 Support öffnen',()=>openApp('support')]]);
    return null;
  },
  async remote(q){
    const c=this.cfg(),h=this.hist().filter(m=>m.t).slice(-10).map(m=>({role:m.r=='me'?'user':'assistant',content:m.t}));
    const ac=new AbortController(),to=setTimeout(()=>ac.abort(),90000);
    try{
      const r=await fetch(c.url,{method:'POST',headers:{'Content-Type':'application/json',...(c.key?{Authorization:'Bearer '+c.key}:{})},signal:ac.signal,
        body:JSON.stringify({model:c.model,stream:false,max_tokens:500,messages:[{role:'system',content:'Du bist LucarioBot, der Assistent des Handy-Betriebssystems LucarioNet. Antworte immer auf Deutsch, freundlich und kurz.'},...h,{role:'user',content:q}]})});
      if(!r.ok)throw new Error('Der KI-Server antwortete mit Fehler '+r.status);
      const j=await r.json(),t=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
      if(!t)throw new Error('Leere Antwort vom KI-Server');return t.trim();
    }catch(e){if(e.name=='AbortError')throw new Error('Der KI-Server hat nicht rechtzeitig geantwortet');if(e instanceof TypeError)throw new Error('KI-Server nicht erreichbar (Adresse, WLAN oder Browser-Sperre prüfen)');throw e}
    finally{clearTimeout(to)}
  },
  async ask(q){
    const loc=await this.local(q);if(loc)return loc;
    const c=this.cfg();
    if(c.on&&c.url){try{return{text:await this.remote(q)}}catch(e){return{text:'⚠️ '+e.message+'.',chips:[['KI-Einstellungen',()=>{Sys.openPage='ai';openApp('settings')}]]}}}
    return{text:'Das kann ich offline noch nicht beantworten. Schreib „Hilfe“, um zu sehen, was ich kann – oder verbinde einen KI-Server (z. B. Ollama auf dem Raspberry Pi), dann antworte ich auch auf freie Fragen.',chips:[['KI-Server verbinden',()=>{Sys.openPage='ai';openApp('settings')}]]};
  }
};
A.ai=el=>{
  el.style.justifyContent='';
  el.innerHTML='<div class="mh"><b style="flex:1;font-size:19px">🤖 LucarioBot</b><button class="g" id="aic">Neu</button><button class="g" id="ais">⚙</button></div><div class="msgs" id="aim"></div><div id="aich" style="display:flex;gap:6px;flex-wrap:wrap;padding:4px 10px;width:100%"></div><div class="mi2"><input type="text" id="aiq" placeholder="Frag mich etwas …" autocomplete="off"><button class="b" id="aig">➤</button></div>';
  const m=$('#aim');let h=LB.hist(),busy=false;
  const fmt=t=>esc(t).replace(/\n/g,'<br>');
  const bubble=(who,t)=>{const d=document.createElement('div');d.className='bub '+(who=='me'?'out':'in');d.innerHTML=fmt(t);m.appendChild(d);m.scrollTop=m.scrollHeight;return d};
  const chips=list=>{const c=$('#aich');c.innerHTML='';(list||[]).forEach(([t,f])=>{const b=document.createElement('button');b.className='g';b.style.cssText='font-size:13px;padding:6px 10px';b.textContent=t;b.onclick=typeof f=='function'?f:()=>send(f);c.appendChild(b)})};
  const start=()=>{m.innerHTML='';h.forEach(x=>bubble(x.r,x.t));if(!h.length)bubble('bot','Hallo! Ich bin LucarioBot 🤖\nIch öffne Apps, stelle Timer, rechne, ändere Einstellungen und helfe bei Sicherheitsproblemen.'+(LB.cfg().on?'\nDer KI-Server ist verbunden – ich beantworte auch freie Fragen.':''));
    chips(['Wie spät ist es?','Dunkelmodus','Timer 5 Minuten','Meine Daten wurden gestohlen','Was kannst du?','Erzähl einen Witz'].map(t=>[t,t]))};
  async function send(txt){
    const q=(txt!==undefined?txt:$('#aiq').value).trim();if(!q||busy)return;$('#aiq').value='';chips([]);busy=true;
    bubble('me',q);h.push({r:'me',t:q});
    const w=bubble('bot','…');
    let r;try{r=await LB.ask(q)}catch(e){r={text:'⚠️ Unerwarteter Fehler: '+e.message}}
    w.innerHTML=fmt(r.text);h.push({r:'bot',t:r.text});LB.save(h);chips(r.chips);m.scrollTop=m.scrollHeight;busy=false;
  }
  $('#aig').onclick=()=>send();$('#aiq').onkeydown=e=>{if(e.key=='Enter')send()};
  $('#aic').onclick=()=>{h=[];LB.save(h);start()};
  $('#ais').onclick=()=>{Sys.openPage='ai';openApp('settings')};
  start();
};

/* ---------- Sofort-Hilfe / Sicherheits-Center ---------- */
function securityCenter(el,back){
  const me=Sys.session,c=Lock.cfg(),lk=Object.keys(getLinks()).length,ai=LB.cfg();
  const row=(ok,t)=>'<div style="display:flex;gap:8px;margin:4px 0"><span>'+(ok?'✅':'⚠️')+'</span><span>'+t+'</span></div>';
  const card=(t,body)=>'<div class="set"><b>'+t+'</b><div style="margin-top:8px">'+body+'</div></div>';
  el.innerHTML=(back?'<button class="g" id="scb" style="margin:8px 12px;align-self:flex-start">‹ Zurück</button>':'')
  +'<div style="width:100%;padding:0 16px 8px;font-size:21px;font-weight:800">🚨 Sofort-Hilfe</div>'
  +card('Sicherheits-Check',row(!!c,c?'Gerätesperre: '+(c.type=='pin'?'PIN':'Passwort'):'Keine Gerätesperre gesetzt')+row(!!me,me?'Angemeldet als '+esc(me.name)+'@lucario.net':'Kein Konto angemeldet')+row(!lk,lk?lk+' verknüpfte App(s) – prüfe sie unten':'Keine verknüpften Apps')+row(!ai.key,ai.key?'KI-Schlüssel ist auf diesem Gerät gespeichert':'Kein KI-Schlüssel gespeichert')+row(!!(window.isSecureContext),window.isSecureContext?'Sichere Verbindung (https/localhost)':'Keine sichere Verbindung'))
  +card('1 · LucarioID-Passwort ändern','<input class="f" id="sco" type="password" placeholder="Aktuelles Passwort" autocomplete="current-password">'+(me?'':'<input class="f" id="scu" placeholder="Benutzername" autocapitalize="off">')+'<input class="f" id="scn" type="password" placeholder="Neues Passwort (mind. 8 Zeichen)" autocomplete="new-password"><input class="f" id="scn2" type="password" placeholder="Neues Passwort wiederholen" autocomplete="new-password"><button class="b" id="scp" style="margin-top:6px">Passwort ändern</button><div id="scm" style="min-height:20px;margin-top:6px"></div><p style="font-size:12px;opacity:.65;margin:4px 0 0">Deine Nachrichten bleiben lesbar – nur der Schlüssel wird neu geschützt.</p>')
  +card('2 · Gerätesperre ändern','<button class="g" id="scl">Sperre öffnen</button>')
  +card('3 · Abmelden & Verknüpfungen trennen','<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="g" id="sco2">Jetzt abmelden</button><button class="g" id="scv">Alle Apps trennen</button><button class="g" id="sck">KI-Schlüssel löschen</button></div><div id="sc3" style="min-height:20px;margin-top:6px"></div>')
  +card('4 · Echte Dienste absichern','<p style="margin:0;line-height:1.5;font-size:14px">LucarioNet kann Passwörter von WhatsApp, Instagram, Gmail & Co. <b>nicht</b> ändern. Ändere sie direkt beim Dienst und aktiviere die Zwei-Faktor-Anmeldung. Bei Bank- oder Kartendaten: Sperr-Notruf <a href="tel:116116" style="color:var(--acc)"><b>116 116</b></a> anrufen und Anzeige bei der Polizei erstatten.</p>')
  +card('5 · Konto löschen','<p style="margin:0 0 6px;font-size:13px;opacity:.8">Löscht dein LucarioID-Konto samt Mails und Chats auf diesem Gerät. Nicht rückgängig zu machen.</p><input class="f" id="sdn" placeholder="Benutzername"><input class="f" id="sdp" type="password" placeholder="Passwort"><button class="b" id="sdd" style="background:#e74c3c;color:#fff;margin-top:6px">Konto endgültig löschen</button><div id="sdm" style="min-height:20px;margin-top:6px"></div>')
  +card('6 · Gerät zurücksetzen','<p style="margin:0 0 6px;font-size:13px;opacity:.8">Löscht <b>alle</b> Daten auf diesem Gerät (Konten, Nachrichten, Fotos, Einstellungen).</p><input class="f" id="srr" placeholder="Tippe ZURÜCKSETZEN" autocomplete="off"><button class="b" id="srd" style="background:#e74c3c;color:#fff;margin-top:6px">Gerät zurücksetzen</button>');
  const msg=(id,t,ok)=>{const m=$(id);m.innerHTML='<span style="color:'+(ok?'#2ecc71':'#ff8a8a')+'">'+esc(t)+'</span>'};
  if(back)$('#scb').onclick=back;
  $('#scp').onclick=async()=>{
    const n=me?me.name:($('#scu').value||'').trim().toLowerCase(),o=$('#sco').value,a=$('#scn').value;
    if(!n||!o){msg('#scm','Bitte Name und aktuelles Passwort eingeben');return}
    if(a!==$('#scn2').value){msg('#scm','Die neuen Passwörter stimmen nicht überein');return}
    if(a===o){msg('#scm','Das neue Passwort muss anders sein');return}
    $('#scp').disabled=true;msg('#scm','Schlüssel werden neu geschützt…',1);
    try{await Cr.changePassword(n,o,a);Sys.log('keystored: Passwort von '+n+' geändert');msg('#scm','✓ Passwort geändert',1);$('#sco').value=$('#scn').value=$('#scn2').value=''}
    catch(e){msg('#scm',e.message)}
    $('#scp').disabled=false;
  };
  $('#scl').onclick=()=>{Sys.openPage='sec';openApp('settings')};
  $('#sco2').onclick=()=>{Sys.session=null;badges();msg('#sc3','Abgemeldet',1)};
  $('#scv').onclick=()=>{setLinks({});msg('#sc3','Alle verknüpften Apps getrennt',1)};
  $('#sck').onclick=()=>{const c2=LB.cfg();c2.key='';c2.on=0;LB.setCfg(c2);msg('#sc3','KI-Schlüssel gelöscht, KI-Server deaktiviert',1)};
  $('#sdd').onclick=async()=>{
    const n=($('#sdn').value||'').trim().toLowerCase(),p=$('#sdp').value;if(!n||!p){msg('#sdm','Name und Passwort eingeben');return}
    if(!confirm('Konto '+n+'@lucario.net und alle Daten wirklich endgültig löschen?'))return;
    try{await Cr.deleteAccount(n,p);if(Sys.session&&Sys.session.name===n)Sys.session=null;badges();msg('#sdm','Konto gelöscht',1)}catch(e){msg('#sdm',e.message)}
  };
  $('#srd').onclick=()=>{if($('#srr').value.trim().toUpperCase()=='ZURÜCKSETZEN'&&confirm('ALLE Daten auf diesem Gerät löschen?'))factoryReset()};
}

/* ---------- Support-App ---------- */
A.support=el=>{
  const dt=t=>new Date(t).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  const fmt=t=>esc(t).replace(/\n/g,'<br>');
  function home(){
    const tk=Support.all();
    el.innerHTML='<div class="mh"><b style="flex:1;font-size:19px">🛟 Support</b></div>'
    +'<div class="set" style="border:1px solid #ff6b6b88"><b>🚨 Daten gestohlen oder Konto gehackt?</b><p style="margin:8px 0;font-size:14px;opacity:.85">Starte die Sofort-Hilfe: Passwort ändern, Verknüpfungen trennen, Konto absichern.</p><button class="b" id="spk" style="background:#e74c3c;color:#fff">Sofort-Hilfe starten</button></div>'
    +'<div class="set"><b>Team kontaktieren</b><p style="margin:8px 0;font-size:14px;opacity:.85">Schreibe ein Ticket. Du bekommst sofort eine automatische Antwort mit den wichtigsten Schritten. Du kannst auch eine Mail an <b>support@lucario.net</b> schreiben.</p><button class="b" id="spn">＋ Neues Ticket</button></div>'
    +'<div style="width:100%;padding:6px 16px;opacity:.6;font-size:12px">Deine Tickets</div><div id="spl" style="width:100%"></div>';
    $('#spl').innerHTML=tk.length?tk.map(x=>'<div class="mrow" data-i="'+x.id+'"><div style="flex:1;min-width:0"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(x.subject)+'</b><div style="opacity:.6;font-size:12px">'+x.id+' · '+dt(x.date)+'</div></div><span style="font-size:12px;padding:3px 8px;border-radius:10px;background:var(--glass)">'+x.status+'</span></div>').join(''):'<div style="padding:12px 16px;opacity:.6">Noch keine Tickets.</div>';
    el.querySelectorAll('[data-i]').forEach(d=>d.onclick=()=>detail(d.dataset.i));
    $('#spk').onclick=help;$('#spn').onclick=form;
  }
  function help(){securityCenter(el,home)}
  function form(){
    el.innerHTML='<button class="g" id="spb" style="margin:8px 12px;align-self:flex-start">‹ Abbrechen</button><div style="width:100%;padding:0 16px"><b style="font-size:19px">Neues Ticket</b><select class="f" id="spc">'+Support.cats.map(c=>'<option value="'+c[0]+'">'+c[1]+'</option>').join('')+'</select><input class="f" id="sps" placeholder="Betreff"><textarea id="spt" rows="6" placeholder="Was ist passiert?" style="width:100%"></textarea><p style="font-size:12px;opacity:.65;line-height:1.4">Schreibe keine Passwörter oder PINs in das Ticket. Tickets liegen unverschlüsselt auf diesem Gerät.</p><button class="b" id="spd" style="width:100%">Ticket senden</button><div id="spm" style="min-height:20px;margin-top:6px"></div></div>';
    $('#spb').onclick=home;
    $('#spd').onclick=()=>{
      const t=$('#spt').value.trim(),s=$('#sps').value.trim();
      if(!t){$('#spm').innerHTML='<span style="color:#ff8a8a">Bitte beschreibe dein Problem.</span>';return}
      const tk=Support.create({cat:$('#spc').value,subject:s||t.slice(0,40),text:t,from:Sys.session?Sys.session.name:'anonym'});
      Sys.toast('Ticket '+tk.id+' erstellt');detail(tk.id);
    };
  }
  function detail(id){
    const a=Support.all(),tk=a.find(x=>x.id==id);if(!tk)return home();
    el.innerHTML='<button class="g" id="spb" style="margin:8px 12px;align-self:flex-start">‹ Tickets</button><div style="width:100%;padding:0 16px"><b style="font-size:18px">'+esc(tk.subject)+'</b><div style="opacity:.6;font-size:12px;margin:2px 0 8px">'+tk.id+' · '+esc((Support.cats.find(c=>c[0]==tk.cat)||[0,''])[1])+' · '+tk.status+'</div></div><div class="msgs" style="flex:1" id="spx">'+tk.msgs.map(m=>'<div class="bub '+(m.who=='me'?'out':'in')+'">'+fmt(m.text)+'<span>'+(m.who=='me'?'Du':'Support (automatisch)')+' · '+dt(m.t)+'</span></div>').join('')+'</div><div class="mi2"><input type="text" id="spr" placeholder="Weitere Info hinzufügen …"><button class="b" id="spa">➤</button></div><div style="display:flex;gap:8px;padding:0 10px 10px;flex-wrap:wrap"><button class="g" id="spe">✉ Per E-Mail an Team senden</button>'+(tk.cat=='hack'?'<button class="g" id="sph">🚨 Sofort-Hilfe</button>':'')+'<button class="g" id="spc2">'+(tk.status=='Offen'?'Ticket schließen':'Wieder öffnen')+'</button></div>';
    $('#spb').onclick=home;
    const x=$('#spx');x.scrollTop=x.scrollHeight;

  async function fightWave(p,me,wave){

      if(full){const kl=killLine(me);if(kl)log.push('    '+kl)}killRewards(p,f,false,log)}};

    let wm=0,wo=0,rnd_=0;
    while(wm<2&&wo<2){
      rnd_++;
      for(const f of[me,opp]){f.hp=100;f.meds=1;f.cd=0;f.phase=0;f.frost=0;f.frozen=0;f.accpen=0;f.aimed=false}

          const human=who===me||hot;let action;
          if(human&&!AUTO){
            if(hot)await ask('>> '+who.name+' ist dran',[['','▶ Los']]);
            const abil=abilsOf(who);
            for(;;){
              const ch=[['s','🎯 Schießen'],['z','🔭 Zielen'],['d','🛡 Deckung'],['m','💊 Medkit']];
              abil.forEach((a,i)=>ch.push(['fg'[i],ABIL_NAME[a]]));

              else if((raw=='f'||raw=='g')&&abil.length>'fg'.indexOf(raw))action=['ability',abil['fg'.indexOf(raw)]];

          else{action=autoAction(who,[foe]);if(R.f()<0.15&&action[0]=='shoot')action=['aim']}

          for(const l of log)out(who!==me?'  '+l.split('Du ').join(who.name+' '):'  '+l);
          if(who.turbo&&R.f()<0.25&&foe.alive&&action[0]=='shoot'){out('  ⚡ TURBO! Gratis-Schuss.');for(const l of act(who,['shoot',foe],[foe],true,pp))out('  '+l)}
          if(action[0]!='cover')who.cover=false;

/* ================= 6.0: Text-Oberfläche (Terminal-Fenster) für Arena und Terminal-App ================= */
function TermUI(el,o={}){
  el.innerHTML='<div class="tmw"><div class="tmst"></div><div class="tmo"></div><div class="tmc"></div><form class="tmi"><span class="tmp">›</span><input type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="send"><button class="b" type="submit">⏎</button></form></div>';
  const q=s=>el.querySelector(s),box=q('.tmo'),ch=q('.tmc'),form=q('.tmi'),inp=q('.tmi input'),ps=q('.tmp'),st=q('.tmst');
  const fmt=s=>esc(s).replace(/\u0001([\d;]+)\u0002/g,(m,c)=>'<span class="ta'+c.replace(';','_')+'">').replace(/\u0003/g,'</span>');
  let res=null,dead=false,choices=[],tmpEl=null,hist=[],hi=0;
  const down=()=>{box.scrollTop=box.scrollHeight};
  const ui={
    print(s,cls){if(dead)return;const d=document.createElement('div');d.innerHTML=fmt(s);if(cls)d.className=cls;box.appendChild(d);
      while(box.children.length>400)box.removeChild(box.children[0]);down()},
    clear(){box.innerHTML=''},
    tmp(t){if(dead)return;if(!tmpEl||!tmpEl.parentNode){tmpEl=document.createElement('div');tmpEl.className='tmd';box.appendChild(tmpEl)}
      tmpEl.textContent=t;if(!t&&tmpEl.parentNode){box.removeChild(tmpEl);tmpEl=null}down()},
    status(h){if(dead)return;st.innerHTML=h;st.style.display=h?'block':'none'},
    setPrompt(t){ps.textContent=t},
    history:()=>hist,
    read(prompt,choiceList,opt={}){
      return new Promise(resolve=>{
        if(dead)return;
        choices=choiceList||[];
        if(prompt&&(o.showPrompt||!choices.length))ui.print(prompt,'tmd');
        ps.textContent=opt.ps||'›';
        ch.innerHTML='';
        choices.forEach(([k,label])=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>done(k,label);ch.appendChild(b)});
        const showInput=o.alwaysInput||!choices.length;
        form.style.display=showInput?'flex':'none';
        res=resolve;
        if(showInput&&!o.noFocus)try{inp.focus()}catch(e){}
        function done(v,label){
          if(!res)return;const r=res;res=null;ch.innerHTML='';choices=[];inp.value='';
          if(!opt.noEcho)ui.print((opt.ps||'›')+' '+(label&&label!==v?label:v),'tmd');
          if(opt.hist&&v.trim()){hist.push(v);hi=hist.length}
          r(v.trim())}
        ui._done=done})},
  };
  form.onsubmit=e=>{if(e&&e.preventDefault)e.preventDefault();if(ui._done&&res)ui._done(inp.value,null);return false};
  inp.onkeydown=e=>{
    if(!o.alwaysInput)return;
    if(e.key=='ArrowUp'&&hist.length){hi=Math.max(0,hi-1);inp.value=hist[hi]||'';e.preventDefault()}
    else if(e.key=='ArrowDown'&&hist.length){hi=Math.min(hist.length,hi+1);inp.value=hist[hi]||'';e.preventDefault()}
    else if(e.key=='Tab'&&o.complete){e.preventDefault();const w=inp.value.split(' ');if(w.length==1){const m=o.complete.filter(x=>x.startsWith(w[0]));if(m.length==1)inp.value=m[0]+' '}}};
  /* Desktop-Komfort: Tasten wählen die gleichnamige Schaltfläche */
  const kd=e=>{if(dead||!res||e.ctrlKey||e.metaKey||e.altKey)return;
    if(document.activeElement===inp&&e.key!='Escape')return;
    const k=e.key=='Enter'?'':e.key.toLowerCase();const c=choices.find(x=>x[0]==k);if(c&&ui._done){e.preventDefault();ui._done(c[0],c[1])}};
  document.addEventListener('keydown',kd);
  ui.dispose=()=>{dead=true;res=null;document.removeEventListener('keydown',kd)};
  ui.box=box;ui.focus=()=>{try{inp.focus()}catch(e){}};
  box.onclick=()=>{if(o.alwaysInput)ui.focus()};
  return ui}

/* ================= 6.2: Lucario Arena – Echtzeit-Kampf (Simulation ohne Zeichnen, damit sie testbar ist) ================= */
const Live=(()=>{
  const W=360,H=560,C=()=>Arena.core;
  const T={HPMUL:4,PRATE:2.2,DRATE:1.7,PSPD:115,PBSPD:470,EBSPD:1.2,FIRE:1.8,DMG:1.4};  /* Stellschrauben für das Balancing */
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const KIND={
    grunt:{r:11,spd:42,range:150,fire:[1.7,2.9],burst:1,bspd:125,spread:.16},
    elite:{r:13,spd:54,range:120,fire:[1.4,2.3],burst:2,bspd:150,spread:.12},
    boss:{r:27,spd:28,range:175,fire:[1.2,1.8],burst:3,bspd:140,spread:.3}};
  let uid=0;
  class Sim{
    constructor(o){
      this.R=C().R;this.mode=o.mode;this.t=0;this.bullets=[];this.fx=[];this.holes=[];this.enemies=[];this.ev=[];this.queue=[];this.wave=o.wave||1;this.over=false;this.winner=null;
      this.players=[this.mk(o.me,'a',W/2,H-100)];
      if(o.mode=='duel')this.players.push(this.mk(o.opp,'b',W/2,100));
      else this.startWave(this.wave);
    }
    mk(s,team,x,y){
      const K=C().SKIN,w=s.weapon?K[s.weapon]:null,ch=s.char?K[s.char]:null,duel=this.mode=='duel';
      const pl={id:++uid,team,x,y,r:11,hp:100,max:100,meds:s.meds??(duel?1:3),ai:!!s.ai,name:s.name||(ch?ch.name:'Du'),
        weapon:w,char:ch,wab:w?w.ab:null,cab:ch?ch.ab:null,spd:T.PSPD,rate:duel?T.DRATE:T.PRATE,dmin:20,dmax:30,
        shootT:0.3,cdAb:0,phase:0,frozen:0,frost:0,slow:0,turbo:false,ang:team=='a'?-Math.PI/2:Math.PI/2,inp:{x:0,y:0},aiT:0,aiDir:1,flash:0,hurt:0,dead:false,kills:0};
      if(pl.cab=='turbo'){pl.turbo=true;pl.spd*=1.5;pl.rate*=1.25}
      return pl};
    startWave(n){
      this.wave=n;const foes=C().spawnWave(n);
      this.queue=foes.map((f,i)=>({f,at:this.t+0.4+i*0.55}));this.cleared=false;this.waveStart=this.t};
    spawn(f){
      const k=KIND[f.kind];
      const e={id:++uid,kind:f.kind,name:f.name,x:30+this.R.f()*(W-60),y:-20,r:k.r,hp:Math.round(f.hp*T.HPMUL),max:Math.round(f.hp*T.HPMUL),dmin:f.dmin,dmax:f.dmax,
        spd:k.spd,fireT:this.R.f()*k.fire[1]+0.8,burstLeft:0,burstT:0,frozen:0,frost:0,stun:0,hit:0,rage:false,mult:1+0.05*(this.wave-1),tx:30+this.R.f()*(W-60),ty:70+this.R.f()*130};
      this.enemies.push(e)};
    me(){return this.players[0]}
    foesOf(pl){return pl.team=='a'?(this.mode=='duel'?[this.players[1]]:this.enemies):[this.players[0]]}
    nearest(pl,list){let b=null,bd=1e9;for(const e of list){if(e.dead||e.hp<=0)continue;const d=Math.hypot(e.x-pl.x,e.y-pl.y);if(d<bd){bd=d;b=e}}return b}
    useMed(pl){if(pl.meds<=0||pl.hp>=pl.max||pl.dead)return false;pl.meds--;const h=Math.min(40,pl.max-pl.hp);pl.hp+=h;this.float(pl.x,pl.y-18,'+'+h,'#5dff9a');return true}
    ability(pl){
      if(pl.cdAb>0||pl.dead)return false;const duel=this.mode=='duel';
      if(pl.cab=='phase'){pl.phase=duel?1:2;pl.cdAb=10;this.float(pl.x,pl.y-20,'PHASE','#bfe');return true}
      if(pl.wab=='blackhole'){
        const tgt=this.nearest(pl,this.foesOf(pl));const hx=tgt?tgt.x:W/2,hy=tgt?tgt.y:H/2;
        this.holes.push({x:hx,y:hy,t:2.4,r:100,team:pl.team});pl.cdAb=12;
        for(const f of this.foesOf(pl)){if(Math.hypot(f.x-hx,f.y-hy)<100){this.hurt(f,duel?24:30,pl,false);if(duel)f.slow=1.8;else f.stun=2.2}}
        this.ev.push({t:'hole'});return true}
      return false}
    hurt(tg,d,src,crit){
      if(tg.hp<=0||tg.dead)return;
      if(tg.phase>0)return;
      tg.hp-=d;tg.hit=0.12;this.float(tg.x+(this.R.f()*10-5),tg.y-tg.r-4,String(Math.round(d)),crit?'#ffd93d':'#fff',crit);
      if(tg.hp<=0){tg.hp=0;this.kill(tg,src)}}
    kill(tg,src){
      for(let i=0;i<14;i++)this.fx.push({x:tg.x,y:tg.y,vx:(this.R.f()-.5)*220,vy:(this.R.f()-.5)*220,t:.5+this.R.f()*.4,c:tg.kind=='boss'?'#ff5c6c':'#ffb347',s:2+this.R.f()*3});
      if(tg.team){tg.dead=true;this.ev.push({t:'pdead',who:tg})}
      else{this.ev.push({t:'kill',foe:{kind:tg.kind,wave_mult:tg.mult,name:tg.name},x:tg.x,y:tg.y});if(src)src.kills++}}
    float(x,y,text,c,big){this.fx.push({x,y,vx:0,vy:-34,t:.8,txt:text,c,big})}
    shoot(pl,tg){
      const a=Math.atan2(tg.y-pl.y,tg.x-pl.x)+(this.R.f()-.5)*0.04;pl.ang=a;pl.flash=.06;
      let d=this.R.int(pl.dmin,pl.dmax),crit=this.R.f()<.10;if(crit)d=Math.floor(d*1.8);
      const sp=this.mode=='duel'?330:T.PBSPD;
      this.bullets.push({x:pl.x+Math.cos(a)*14,y:pl.y+Math.sin(a)*14,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,d,crit,team:pl.team,own:pl,r:3.4,life:1.6,c:'p'})}
    enemyShoot(e,pl){
      const k=KIND[e.kind],n=k.burst;
      for(let i=0;i<n;i++){
        const base=Math.atan2(pl.y-e.y,pl.x-e.x),off=e.kind=='boss'?(i-1)*0.24:0,a=base+off+(this.R.f()-.5)*k.spread*2;
        const d=this.R.int(e.dmin,e.dmax)*(e.rage?1.2:1)*T.DMG;
        this.bullets.push({x:e.x,y:e.y+e.r*.6,vx:Math.cos(a)*k.bspd*T.EBSPD,vy:Math.sin(a)*k.bspd*T.EBSPD,d,team:'e',own:e,r:3.6,life:4,c:'e'})}}
    step(dt,inputs){
      if(this.over)return;this.t+=dt;const duel=this.mode=='duel';
      /* Spawns */
      for(let i=this.queue.length-1;i>=0;i--)if(this.queue[i].at<=this.t){this.spawn(this.queue[i].f);this.queue.splice(i,1)}
      /* Spieler */
      for(const pl of this.players){
        if(pl.dead)continue;
        const inp=pl.ai?this.aiInput(pl):(inputs&&inputs[pl.team])||pl.inp;
        if(pl.cdAb>0)pl.cdAb-=dt;if(pl.phase>0)pl.phase-=dt;if(pl.frozen>0)pl.frozen-=dt;if(pl.slow>0)pl.slow-=dt;if(pl.hurt>0)pl.hurt-=dt;if(pl.flash>0)pl.flash-=dt;if(pl.hit>0)pl.hit-=dt;
        const m=Math.hypot(inp.x,inp.y),sp=pl.spd*(pl.slow>0?.5:1)*(pl.frozen>0?0:1);
        if(m>.05){const k=Math.min(1,m)/m;pl.x+=inp.x*k*sp*dt;pl.y+=inp.y*k*sp*dt}
        pl.x=clamp(pl.x,pl.r,W-pl.r);
        if(duel)pl.y=clamp(pl.y,pl.team=='a'?H*.5:pl.r,pl.team=='a'?H-pl.r:H*.5);else pl.y=clamp(pl.y,H*.3,H-pl.r);
        pl.shootT-=dt;
        const tgt=this.nearest(pl,this.foesOf(pl));
        if(tgt){pl.ang=Math.atan2(tgt.y-pl.y,tgt.x-pl.x);
          if(pl.shootT<=0&&pl.frozen<=0&&(!duel||pl.slow<=0||true)&&tgt.y>-5){this.shoot(pl,tgt);pl.shootT=1/pl.rate}}
        if(pl.ai){pl.aiT-=dt;if(pl.hp<35&&pl.meds>0)this.useMed(pl);if(pl.cdAb<=0&&(pl.cab=='phase'&&pl.hp<60||pl.wab=='blackhole'))this.ability(pl)}
      }
      /* Gegner */
      if(!duel){
        const me=this.me(),order=[...this.enemies].sort((a,b)=>Math.hypot(a.x-me.x,a.y-me.y)-Math.hypot(b.x-me.x,b.y-me.y));
        const att=new Set(order.slice(0,3));this.enemies.forEach(e=>{if(e.kind=='boss')att.add(e)});
        for(const e of this.enemies){
          const k=KIND[e.kind];if(e.hit>0)e.hit-=dt;
          if(e.kind=='boss'&&!e.rage&&e.hp<e.max/2){e.rage=true;this.float(e.x,e.y-40,'RAGE!','#ff5c6c',true)}
          if(e.frozen>0){e.frozen-=dt;continue}if(e.stun>0){e.stun-=dt;continue}
          if(e.y<0){e.y+=70*dt;continue}
          const d=Math.hypot(me.x-e.x,me.y-e.y);
          let dx=0,dy=0;
          if(d>k.range){dx=me.x-e.x;dy=me.y-e.y}else if(d<k.range*.6){dx=e.x-me.x;dy=e.y-me.y}else{dx=-(me.y-e.y)*(e.id%2?1:-1);dy=(me.x-e.x)*(e.id%2?1:-1)}
          const L=Math.hypot(dx,dy)||1;const sp=e.spd*(e.rage?1.25:1);e.x=clamp(e.x+dx/L*sp*dt,e.r,W-e.r);e.y=clamp(e.y+dy/L*sp*dt,5,H-e.r);
          if(att.has(e)&&me.hp>0&&!me.dead){
            if(e.burstLeft>0){e.burstT-=dt;if(e.burstT<=0){this.enemyShoot({...e,kind:'grunt',dmin:e.dmin,dmax:e.dmax,rage:e.rage,x:e.x,y:e.y,r:e.r},me);e.burstLeft--;e.burstT=.14}}
            else{e.fireT-=dt*(e.rage?1.35:1)*T.FIRE;if(e.fireT<=0){const kk=KIND[e.kind];e.fireT=kk.fire[0]+this.R.f()*(kk.fire[1]-kk.fire[0]);if(e.kind=='elite'){e.burstLeft=1;e.burstT=.14}this.enemyShoot(e,me)}}
          }
        }
      }
      /* Schwarze Löcher */
      for(let i=this.holes.length-1;i>=0;i--){const h=this.holes[i];h.t-=dt;
        if(this.mode=='wave')for(const e of this.enemies){const d=Math.hypot(h.x-e.x,h.y-e.y);if(d<h.r&&d>3){e.x+=(h.x-e.x)/d*90*dt;e.y+=(h.y-e.y)/d*90*dt}}
        if(h.t<=0)this.holes.splice(i,1)}
      /* Kugeln */
      for(let i=this.bullets.length-1;i>=0;i--){
        const b=this.bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
        let rm=b.life<=0||b.x<-20||b.x>W+20||b.y<-30||b.y>H+30;
        if(!rm){
          if(b.team=='a'||b.team=='b'){
            const list=this.foesOf(b.own);
            for(const f of list){if(f.hp<=0||f.dead||(f.y<0&&!duel))continue;if(Math.hypot(f.x-b.x,f.y-b.y)<f.r+b.r){
              if(f.phase>0){continue}
              this.hurt(f,b.d,b.own,b.crit);rm=true;
              const wab=b.own.wab;if(wab=='frost'&&f.hp>0){f.frost++;if(f.frost>=(duel?4:3)){f.frost=0;if(duel)f.slow=1.4;else f.frozen=2.2;this.float(f.x,f.y-24,'EINGEFROREN','#8fd8ff')}}
              break}}
          }else{
            const p=this.me();
            if(!p.dead&&p.phase<=0&&Math.hypot(p.x-b.x,p.y-b.y)<p.r+b.r){
              rm=true;if(p.turbo&&this.R.f()<.25){this.float(p.x,p.y-18,'AUSGEWICHEN','#ffd93d')}else{p.hp-=b.d;p.hurt=.18;this.float(p.x,p.y-18,String(Math.round(b.d)),'#ff8f8f');if(p.hp<=0){p.hp=0;p.dead=true;this.ev.push({t:'pdead',who:p})}}}
          }
        }
        if(rm)this.bullets.splice(i,1)}
      /* Gegner aufräumen, Welle fertig? */
      this.enemies=this.enemies.filter(e=>e.hp>0);
      if(!duel&&!this.cleared&&!this.queue.length&&!this.enemies.length){this.cleared=true;this.ev.push({t:'clear',wave:this.wave})}
      if(duel&&!this.over){const a=this.players[0],b=this.players[1];if(a.dead||b.dead){this.over=true;this.winner=a.dead&&b.dead?null:a.dead?'b':'a'}}
      if(!duel&&this.me().dead)this.over=true;
      /* Effekte */
      for(let i=this.fx.length-1;i>=0;i--){const f=this.fx[i];f.t-=dt;f.x+=(f.vx||0)*dt;f.y+=(f.vy||0)*dt;if(f.t<=0)this.fx.splice(i,1)}
    }
    /* Computer-Steuerung: Gegner im Duell und Autopilot für die Simulation */
    aiInput(pl){
      if(pl.aiT<=0){pl.aiT=.5+this.R.f()*.9;pl.aiDir=this.R.f()<.5?-1:1}
      const v=this.dodge(pl);let x=pl.aiDir*.8+v.x*1.6,y=v.y*1.6;
      const foe=this.nearest(pl,this.foesOf(pl));if(foe){const d=Math.abs(foe.y-pl.y);if(d<170)y+=(pl.team=='b'?-1:1)*.5;else if(d>260)y-=(pl.team=='b'?-1:1)*.3}
      if(pl.x<40)x=Math.abs(x);if(pl.x>W-40)x=-Math.abs(x);
      return{x:clamp(x,-1,1),y:clamp(y,-1,1)}}
    dodge(pl){
      let x=0,y=0;
      for(const b of this.bullets){if(b.team==pl.team||(this.mode=='wave'&&b.team=='a'))continue;
        const rx=pl.x-b.x,ry=pl.y-b.y,d=Math.hypot(rx,ry);if(d>95||d<1)continue;
        const sp=Math.hypot(b.vx,b.vy),dot=(b.vx*rx+b.vy*ry)/(sp*d);if(dot<.35)continue;
        const px=-b.vy/sp,py=b.vx/sp,side=(rx*px+ry*py)>=0?1:-1,w=(1-d/95)*dot;x+=px*side*w;y+=py*side*w}
      return{x,y}}
    autoInput(pl){
      const v=this.dodge(pl);let x=v.x*2.2,y=v.y*2.2;
      for(const e of this.enemies){const dx=pl.x-e.x,dy=pl.y-e.y,d=Math.hypot(dx,dy);const keep=e.kind=='boss'?190:130;if(d<keep&&d>1){const w=(1-d/keep)*1.6;x+=dx/d*w;y+=dy/d*w}}
      if(pl.x<45)x+=.9;if(pl.x>W-45)x-=.9;y+=(H*.78-pl.y)/H*1.2;
      if(Math.abs(x)+Math.abs(y)<.15)x=Math.sin(this.t*1.3)*.5;
      return{x:clamp(x,-1,1),y:clamp(y,-1,1)}}
    autoUse(pl){
      const alive=this.enemies.length;
      if(pl.hp<45&&pl.meds>0)this.useMed(pl);
      if(pl.cdAb<=0){if(pl.cab=='phase'&&(pl.hp<70||alive>=3))this.ability(pl);else if(pl.wab=='blackhole'&&alive>=3)this.ability(pl)}}
  }
  /* Ein kompletter Autopilot-Lauf (für die Balancing-Simulation) */
  function autoRun(Rnd,loadout,maxWave=60){
    const p=C().newProfile(),prof=p;let wave=1;const dt=1/30;let coins=0,dia=0;
    for(;;){
      const sim=new Sim({mode:'wave',wave,me:{weapon:loadout&&loadout.weapon,char:loadout&&loadout.char,meds:3}});
      if(wave>1&&prof._hp!==undefined){sim.me().hp=prof._hp;sim.me().meds=prof._meds}
      let tt=0;
      while(!sim.over&&!sim.cleared&&tt<240){
        sim.step(dt,{a:sim.autoInput(sim.me())});sim.autoUse(sim.me());tt+=dt;
        for(const ev of sim.ev){if(ev.t=='kill'){const d0=prof.diamonds,c0=prof.coins;C().killRewards(prof,ev.foe,false,[]);coins+=prof.coins-c0;dia+=prof.diamonds-d0}}
        sim.ev.length=0}
      if(sim.me().dead||tt>=240)return{wave,coins,dia};
      coins+=C().WAVE_BONUS_BASE+C().WAVE_BONUS_STEP*wave;
      prof._hp=Math.min(100,sim.me().hp+40);prof._meds=Math.min(3,sim.me().meds+1);wave++;if(wave>maxWave)return{wave,coins,dia}}}
  return{Sim,W,H,T,autoRun,KIND}
})();


/* ================= 6.2: LUCARIO ARENA – grafische App ================= */
const ArenaGUI={
  RC:{Common:'#9aa4b8',Rare:'#3b82f6',Epic:'#a855f7',Legendary:'#fbbf24',Mythic:'#ff4d6d'},
  hue(id){let h=0;for(const ch of id)h=(h*31+ch.charCodeAt(0))%360;return h},
  icon(id,w=64){
    const C=Arena.core,s=C.SKIN[id];if(!s)return '<svg width="'+w+'" height="'+w+'"></svg>';
    const h=this.hue(id),a='hsl('+h+',80%,58%)',b='hsl('+((h+40)%360)+',70%,35%)',c=this.RC[s.rar],glow=s.rar=='Mythic'||s.rar=='Legendary'?'<circle cx="32" cy="32" r="26" fill="'+c+'" opacity=".18"/>':'';

    hud(){

    draw(){

      g.setTransform(1,0,0,1,0,0);g.fillStyle='#0a0d1c';g.fillRect(0,0,this.cv.width,this.cv.height);

      g.strokeStyle='#ffffff0c';g.lineWidth=1;for(let x=0;x<=W;x+=30){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}for(let y=((s.t*20)%30);y<=H;y+=30){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}

      for(const f of s.fx){if(f.txt){g.globalAlpha=Math.min(1,f.t*2);g.fillStyle=f.c;g.font=(f.big?'bold 15px':'bold 11px')+' system-ui';g.textAlign='center';g.strokeStyle='#000';g.lineWidth=3;g.strokeText(f.txt,f.x,f.y);g.fillText(f.txt,f.x,f.y);g.globalAlpha=1}else{g.globalAlpha=Math.max(0,f.t*2);g.fillStyle=f.c;g.fillRect(f.x,f.y,f.s,f.s);g.globalAlpha=1}}
      if(this.bt>0){g.globalAlpha=Math.min(1,this.bt);g.fillStyle='#fff';g.font='900 34px system-ui';g.textAlign='center';g.strokeStyle='#000';g.lineWidth=5;g.strokeText(this.banner,W/2,H/2-40);g.fillText(this.banner,W/2,H/2-40);g.globalAlpha=1}
      if(s.me().hurt>0){g.fillStyle='rgba(255,0,40,'+s.me().hurt*1.2+')';g.fillRect(0,0,W,H)}}
    drawPlayer(g,p){
      const h=G.hue(p.char?p.char.id:'x'),hw=G.hue(p.weapon?p.weapon.id:'y'),foe=p.team=='b';
      g.save();g.translate(p.x,p.y);if(p.phase>0)g.globalAlpha=.4;

    drawEnemy(g,e){

      g.shadowBlur=0;g.fillStyle=e.rage?'#ff0':'#ffe66d';const ey=e.r*.25,ex=e.r*.38;g.beginPath();g.arc(-ex,-ey,e.r*.17,0,7);g.arc(ex,-ey,e.r*.17,0,7);g.fill();

      if(e.kind=='boss'){g.fillStyle='#fff';g.font='bold 10px system-ui';g.textAlign='center';g.fillText(e.name.replace('BOSS: ',''),e.x,e.y-e.r-14)}}
  }
  S.menu();
  return()=>{alive=false;stopGame();save()};
};

      const len=ctx.sampleRate*0.7,buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);

  function gen(){

      if(it.k==0){g.fillStyle='#e03b3b';g.fillRect(-4,-5,8,10);g.fillStyle='#ddd';g.fillRect(-4,-5,8,2)}else if(it.k==1){g.fillStyle='#fff';g.beginPath();g.ellipse(0,0,6,5,.5,0,7);g.fill();g.strokeStyle='#bbb';g.stroke()}else{g.fillStyle='#16161e';g.beginPath();g.ellipse(0,0,7,6,0,0,7);g.fill();g.fillRect(-1,-9,2,4)}
      g.restore()}
    /* Eimer und Schild am Start */
    g.fillStyle='#ffd21f';g.fillRect(W/2+44,(WALL+2)*CELL,22,18);g.fillStyle='#222';g.fillRect(W/2+44,(WALL+2)*CELL+5,22,3);
    g.fillStyle='#ffd21f';g.beginPath();g.moveTo(W/2-70,(WALL+3)*CELL);g.lineTo(W/2-56,(WALL+3)*CELL-26);g.lineTo(W/2-42,(WALL+3)*CELL);g.fill();g.fillStyle='#222';g.fillRect(W/2-58,(WALL+3)*CELL-14,4,8);
    /* Figur */
    drawPlayer();
    for(const p of parts){g.globalAlpha=Math.min(1,p.t*2);if(p.txt){g.fillStyle=p.c;g.font='bold 12px system-ui';g.textAlign='center';g.strokeStyle='#000';g.lineWidth=3;g.strokeText(p.txt,p.x,p.y);g.fillText(p.txt,p.x,p.y)}else{g.fillStyle=p.c;g.fillRect(p.x,p.y,3,3)}g.globalAlpha=1}
    g.setTransform(dpr,0,0,dpr,0,0);
    if(tx!=null){g.strokeStyle='#ffffffaa';g.lineWidth=2;g.beginPath();g.arc(tx-cam.x,ty-cam.y,9,0,7);g.stroke()}
    /* Pfeil zum nächsten Dreck */
    const ar=$e('#pzar');let seen=false,bx=0,by=0,bd=1e9;
    if(++arT>15){arT=0;nx=null;for(let i=0;i<tier.length;i++)if(tier[i]){const x=(i%cols+.5)*CELL,y=(Math.floor(i/cols)+.5)*CELL,d=Math.hypot(x-px,y-py);if(d<bd){bd=d;bx=x;by=y}}if(bd<1e9)nx=[bx,by]}
    if(nx&&(nx[0]<cam.x||nx[0]>cam.x+vw||nx[1]<cam.y||nx[1]>cam.y+vh)){ar.style.display='block';const a=Math.atan2(nx[1]-py,nx[0]-px);ar.style.transform='translate(-50%,-50%) rotate('+a+'rad)';ar.style.left=(vw/2+Math.cos(a)*Math.min(vw,vh)*.38)+'px';ar.style.top=(vh/2+Math.sin(a)*Math.min(vw,vh)*.38)+'px'}else ar.style.display='none'}
  let arT=99,nx=null;
  function drawPlayer(){
    g.save();g.translate(px,py);
    g.fillStyle='#0003';g.beginPath();g.ellipse(0,12,11,4,0,0,7);g.fill();
    const b=Math.sin(walk)*2;
    g.fillStyle='#16161e';g.fillRect(-6,2,5,10+Math.max(0,b));g.fillRect(1,2,5,10-Math.min(0,b)+Math.max(0,-b));
    g.fillStyle='#fff';g.fillRect(-7,10+Math.max(0,b),7,3);g.fillRect(0,10-Math.min(0,b),7,3);
    g.fillStyle='#22222c';g.fillRect(-7,-8,14,12);
    g.fillStyle='#f2c29b';g.beginPath();g.arc(0,-14,7,0,7);g.fill();
    g.fillStyle='#8a5a2b';g.beginPath();g.arc(0,-17,7,Math.PI,0);g.fill();g.fillRect(-7,-18,14,3);
    g.fillStyle='#222';g.fillRect(face*2-1,-14,2,3);
    /* Mopp */
    const hx=face*20,hy=6+Math.sin(walk)*2,m=P.MOPS[mopI()];
    g.strokeStyle='#c28b3c';g.lineWidth=3;g.lineCap='round';g.beginPath();g.moveTo(face*5,-4);g.lineTo(hx-face*2,hy-2);g.stroke();
    g.fillStyle='#f2c29b';g.beginPath();g.arc(face*5,-3,3,0,7);g.fill();
    g.fillStyle=m.c;g.strokeStyle='#fff';g.lineWidth=1.5;g.beginPath();g.roundRect(hx-9,hy-3,18,8,3);g.fill();g.stroke();
    const sp=spI();if(sp>=0){g.fillStyle=P.SPS[sp].c;g.fillRect(hx-5,hy-6,10,4)}
    g.restore()}
  const loop=t=>{raf=requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000);last=t;step(dt);draw();upd2()};
  let u2=0,sig='';const upd2=()=>{if(++u2%6)return;
    $e('#pzco').textContent=P.fmt(S.coins);$e('#pzer').textContent=P.fmt(S.earned);const done=total-left,p=pct();$e('#pzxi').style.width=(total?done/total*100:100)+'%';$e('#pzxt').textContent=P.fmt(done)+' / '+P.fmt(total)+' XP';
    $e('#pzgi').style.width=p+'%';$e('#pzgt').textContent=p+'%';const lu=$e('#pzlu');lu.classList.toggle('rdy',left<=0);$e('#pzls').textContent=left<=0?'Nächste Karte: Level '+(S.level+1):'(Aktuell: Level '+S.level+') · noch '+(100-p)+' %';
    const sg=P.MOPS.map(m=>S.coins>=m.cost?1:0).join('')+P.SPS.map(m=>S.coins>=m.cost?1:0).join('');if(sg!=sig){sig=sg;panels();$e('#pzpg')&&0}};
  /* ---------- Start ---------- */
  gen();startPos();fit();new ResizeObserver(()=>fit()).observe(view);upd();
  S.seen=Date.now();
  say('Halte den Finger auf die Karte – Putzi läuft hin und wischt den Dreck weg!');
  raf=requestAnimationFrame(loop);
  return()=>{cancelAnimationFrame(raf);removeEventListener('keydown',kd);removeEventListener('keyup',ku);rmOv();save()}
};

/* ===ARENA-END=== */

Core.init();
setTimeout(()=>{$('#boot').style.opacity=0;setTimeout(()=>$('#boot').remove(),600)},1800);
</script>
