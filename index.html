<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>LucarioNet</title>
<style>
:root{--bg1:#0b1020;--bg2:#1b2a6b;--bg3:#00c2ff;--glass:rgba(255,255,255,.12);--txt:#fff;--acc:#4cc9ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--txt)}
#phone{position:relative;width:100%;height:100%;max-width:480px;margin:0 auto;overflow:hidden;background:linear-gradient(160deg,var(--bg1),var(--bg2) 60%,var(--bg3));background-size:cover;background-position:center}
#status{position:absolute;top:0;left:0;right:0;height:34px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:14px;font-weight:600;z-index:50;cursor:pointer;color:var(--htx)}
#home{position:absolute;inset:0;padding:48px 18px 110px;display:flex;flex-direction:column}
#clock{text-align:center;margin:18px 0 8px}
#clock .t{font-size:68px;font-weight:200;letter-spacing:-2px}
#clock .d{font-size:15px;opacity:.8}
#search{margin:10px 0 18px;background:var(--hg);backdrop-filter:blur(14px);border-radius:20px;padding:12px 16px;font-size:15px;opacity:.9;border:1px solid rgba(255,255,255,.15)}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 8px;align-content:start;flex:1;min-height:0;overflow:auto;padding-bottom:10px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;cursor:pointer}
.app .ic{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.35);transition:transform .15s}
.app:active .ic{transform:scale(.88)}
.ic svg{width:36px;height:36px}
#dock{position:absolute;left:14px;right:14px;bottom:30px;height:84px;background:var(--hg);backdrop-filter:blur(20px);border-radius:30px;display:flex;justify-content:space-around;align-items:center;border:1px solid rgba(255,255,255,.18);z-index:5}
#nav{position:absolute;bottom:0;left:0;right:0;height:26px;display:flex;justify-content:center;align-items:center;z-index:60}
#nav div{width:130px;height:5px;border-radius:3px;background:rgba(255,255,255,.85)}
#win{position:absolute;inset:0;background:var(--win);color:var(--txt);z-index:40;display:none;flex-direction:column;padding-top:34px;padding-bottom:26px;transform:scale(.9);opacity:0;transition:.22s}
#win.show{transform:none;opacity:1}
#bar{height:48px;display:flex;align-items:center;padding:0 12px;gap:10px;font-weight:600}
#bar button{background:var(--glass);border:0;color:var(--txt);border-radius:12px;padding:8px 12px;font-size:15px}
#body{flex:1;overflow:auto;position:relative;display:flex;flex-direction:column;align-items:center}
button.b{background:var(--acc);color:var(--onacc);border:0;border-radius:14px;padding:11px 18px;font-weight:700;font-size:15px}
button.g{background:var(--glass);color:var(--txt);border:0;border-radius:14px;padding:11px 16px;font-size:15px}
canvas{background:#0a0d18;border-radius:14px;touch-action:none;max-width:100%}
.gh{display:flex;gap:24px;padding:8px;font-size:16px;font-weight:600}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,56px);gap:6px;margin:10px;justify-content:center}
.pad button{background:var(--glass);border:0;color:var(--txt);border-radius:14px;font-size:22px}
.pad .u{grid-column:2}.pad .l{grid-row:2;grid-column:1}.pad .d{grid-row:2;grid-column:2}.pad .r{grid-row:2;grid-column:3}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px;background:var(--card2);border-radius:14px;width:min(92vw,360px)}
.tile{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:24px;background:var(--card);color:#fff}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(92vw,360px);margin:14px}
.card{aspect-ratio:1;border-radius:14px;background:var(--card);display:grid;place-items:center;font-size:34px;cursor:pointer}
.card.open{background:#4cc9ff}.card.done{background:#2ecc71}
video{width:100%;flex:1;min-height:0;object-fit:cover;background:#000}
.shutter{width:74px;height:74px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.3);margin:12px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:100%;padding:3px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover}
#viewer{position:absolute;inset:0;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:5}
#viewer img{max-width:100%;max-height:75%}
iframe{flex:1;width:100%;border:0;background:#fff}
input[type=text]{flex:1;background:var(--glass);border:0;color:var(--txt);border-radius:14px;padding:10px 14px;font-size:15px;outline:0;min-width:0}
.trk{display:flex;width:100%;padding:12px 18px;border-bottom:1px solid var(--line);gap:12px}
.trk.on{color:var(--acc)}
input[type=range]{width:90%}
.cover{width:200px;height:200px;border-radius:26px;margin:20px;display:grid;place-items:center;background:linear-gradient(135deg,#7b2ff7,#00c2ff);font-size:70px}
.set{width:90%;padding:14px;background:var(--glass);border-radius:16px;margin:8px}
.sw{display:flex;gap:10px;margin-top:10px}.sw div{width:44px;height:44px;border-radius:12px}
#boot{position:absolute;inset:0;background:#05070f;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .6s}
#boot svg{width:110px;height:110px;animation:p 1.4s infinite}
@keyframes p{50%{transform:scale(1.1);filter:drop-shadow(0 0 20px #4cc9ff)}}
.vgrid{width:100%;padding:8px 12px;display:flex;flex-direction:column;gap:18px}
.vc{cursor:pointer}.vc .th{width:100%;aspect-ratio:16/9;border-radius:16px;object-fit:cover;background:#222;display:block}
.vc .meta{padding:8px 4px}
video.pl{width:100%;aspect-ratio:16/9;background:#000;flex:none}
.mrow{width:100%;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;cursor:pointer}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:linear-gradient(135deg,#7b2ff7,#00c2ff);flex:none}
textarea,input.f{width:100%;background:var(--glass);border:0;color:var(--txt);border-radius:12px;padding:12px;font-size:15px;outline:0;margin:5px 0;font-family:inherit}
.tabs{display:flex;gap:6px;padding:6px 10px;width:100%;overflow:auto}.tabs button{white-space:nowrap}
.sc{display:flex;gap:12px;align-items:center;width:100%;padding:12px 16px;border-bottom:1px solid var(--line)}
.sc .ic{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;flex:none}
.sc .ic svg{width:30px;height:30px}
#call{position:absolute;inset:0;z-index:90;display:none;flex-direction:column;align-items:center;padding:90px 20px 40px;background:linear-gradient(160deg,#0b1020,#1b2a6b);text-align:center}
.cav{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;font-size:48px;font-weight:700;background:linear-gradient(135deg,#7b2ff7,#00c2ff);margin-bottom:20px}
.cbtns{display:flex;gap:70px}.cb{width:72px;height:72px;border-radius:50%;border:0;font-size:30px;color:#fff}.cb.red{background:#e74c3c}.cb.green{background:#2ecc71}
#toast{position:absolute;top:40px;left:16px;right:16px;z-index:95;background:rgba(20,26,50,.94);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:12px 16px;font-size:14px;transform:translateY(-140px);transition:.3s;pointer-events:none}
#toast.on{transform:none}
.keys{display:grid;grid-template-columns:repeat(3,76px);gap:12px;justify-content:center;margin:14px 0}.keys button{height:62px;border-radius:50%;border:0;background:var(--glass);color:var(--txt);font-size:24px}
table.t{width:100%;border-collapse:collapse;font-size:13px}table.t td,table.t th{padding:7px 6px;text-align:left;border-bottom:1px solid var(--line)}
.pill{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
#phone{--win:#10131f;--card:#2a3250;--card2:#1c2236;--line:rgba(255,255,255,.08);--txt:#fff;--hg:rgba(255,255,255,.14);--htx:#fff;--tsh:0 1px 3px rgba(0,0,0,.35);--onacc:#04202e;--zoom:1;color:#fff}
#phone[data-theme=light]{--win:#f2f4fa;--card:#dde3f2;--card2:#e8ecf7;--line:rgba(20,26,51,.1);--txt:#141a33;--glass:rgba(20,26,51,.07)}
#home{color:var(--htx)}
#phone.inapp #status{color:var(--txt)}
.app span{text-shadow:var(--tsh)}
.app .ic{position:relative}
.bd{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#ff3b5c;color:#fff;font-size:12px;font-style:normal;font-weight:700;display:none;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.35)}
#body{zoom:var(--zoom)}
#phone.reduce *{transition:none!important;animation:none!important}
input,textarea{user-select:text;-webkit-user-select:text}
input::placeholder,textarea::placeholder{color:var(--txt);opacity:.5}
#search{width:100%;color:var(--htx);outline:0;font-family:inherit}
#search::placeholder{color:var(--htx);opacity:.7}
select.f{appearance:auto}
.tg{position:relative;width:48px;height:28px;flex:none;display:inline-block}
.tg input{opacity:0;width:0;height:0;position:absolute}
.tg span{position:absolute;inset:0;border-radius:14px;background:var(--card);transition:.2s}
.tg span:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}
.tg input:checked+span{background:var(--acc)}
.tg input:checked+span:before{transform:translateX(20px)}
.srow{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);width:100%}
.set .srow{padding:12px 0}
.mi{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);width:100%;cursor:pointer}
.mi .e{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--glass);font-size:19px;flex:none}
.mh{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px}
.msgs{display:flex;flex-direction:column;flex:1;width:100%;overflow:auto;min-height:0;padding:8px 0}
.bub{max-width:78%;padding:8px 12px;border-radius:16px;margin:3px 10px;word-wrap:break-word;overflow-wrap:anywhere;font-size:15px;line-height:1.35}
.bub.in{background:var(--card);align-self:flex-start;border-bottom-left-radius:4px}
.bub.out{background:var(--acc);color:var(--onacc);align-self:flex-end;border-bottom-right-radius:4px}
.bub span{display:block;font-size:10px;opacity:.6;text-align:right;margin-top:2px}
.mi2{display:flex;gap:8px;width:100%;padding:8px 10px 10px}
#lock{position:absolute;inset:0;z-index:120;display:none;flex-direction:column;align-items:center;background:linear-gradient(160deg,#0b1020,#1b2a6b);color:#fff;--txt:#fff;--glass:rgba(255,255,255,.12)}
.dots{margin:10px 0 24px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #fff;margin:0 6px;display:inline-block}.dots i.on{background:#fff}
#qp{position:absolute;left:0;right:0;top:0;z-index:70;transform:translateY(-115%);transition:.3s;background:rgba(14,18,36,.97);backdrop-filter:blur(20px);padding:48px 16px 8px;border-radius:0 0 28px 28px;color:#fff;--txt:#fff;--glass:rgba(255,255,255,.12)}
#qp.on{transform:none}
.qg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.qt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border-radius:18px;border:0;background:var(--glass);color:#fff}
.qt.on{background:var(--acc);color:var(--onacc)}
#qpc{text-align:center;opacity:.6;padding:6px;cursor:pointer}
.ck{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;padding:10px 14px}
.ck button{height:64px;border-radius:20px;border:0;background:var(--glass);color:var(--txt);font-size:22px}
.ck button.op{background:var(--acc);color:var(--onacc)}
.cgr{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;width:100%;padding:4px 12px;text-align:center}
.cd{position:relative;padding:9px 0;border-radius:12px;cursor:pointer}
.cd.today{background:var(--glass);font-weight:700}
.cd.sel{background:var(--acc);color:var(--onacc)}
.cd i{position:absolute;bottom:3px;left:50%;width:5px;height:5px;margin-left:-2px;border-radius:50%;background:#ff6b6b}
.c4{display:flex;gap:6px;padding:10px;border-radius:16px;background:#1e3799;margin:8px}
.c4 .col{display:flex;flex-direction:column;gap:6px;cursor:pointer}
.c4 i{display:block;width:min(11vw,48px);height:min(11vw,48px);border-radius:50%}
.sm{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(80vw,300px);margin:16px}
.sm div{aspect-ratio:1;border-radius:24px;opacity:.55;transition:.1s}.sm div.on{opacity:1;transform:scale(.96)}
.wk{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(86vw,320px);margin:12px}
.wk div{aspect-ratio:1;border-radius:50%;background:#4a3524;display:grid;place-items:center;font-size:46px;cursor:pointer}
#boot{z-index:200!important}
#grid{padding-bottom:24px}
#bat{display:flex;gap:8px;align-items:center}
#wf{cursor:pointer;padding:2px 4px}
#lock{background:radial-gradient(120% 80% at 50% 0%,#1b2a6b 0%,#0b1020 70%);overflow-y:auto}
.lkt{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 18px 0;box-sizing:border-box;font-size:14px}
.lkc{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-family:inherit;cursor:pointer}
.lkk{font-size:76px;font-weight:200;margin-top:70px;line-height:1;letter-spacing:-2px}
.lkd{opacity:.8;margin-top:8px}
.lkh{text-align:center;opacity:.85;padding:0 24px 18px;font-size:14px;line-height:1.7}
.lkf{display:flex;gap:10px;justify-content:center;padding:12px 0 22px;width:100%}
#lock input.f{background:rgba(255,255,255,.14);color:#fff}
#setup{position:absolute;inset:0;z-index:130;display:none;flex-direction:column;background:linear-gradient(160deg,#0b1020,#1b2a6b 70%,#0e5fa8);color:#fff;--txt:#fff;--glass:rgba(255,255,255,.14);--card:rgba(255,255,255,.2);--onacc:#04202e}
.sup{display:flex;gap:6px;padding:22px 24px 0}.sup i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.25)}.sup i.on{background:var(--acc)}
.sub{flex:1;overflow:auto;padding:20px 24px;display:flex;flex-direction:column;justify-content:center}
.suf{padding:14px 24px 28px}
#wifi{position:absolute;inset:0;z-index:140;display:none;flex-direction:column;align-items:center;background:var(--win);color:var(--txt);overflow-y:auto;padding-top:34px}
#wifi.on{display:flex}

/* ================= 6.0: Terminal & Arena ================= */
.tmw{width:100%;flex:1;display:flex;flex-direction:column;min-height:0;background:#0a0e14;color:#cfe3ff;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.tmst{display:none;padding:7px 12px;background:#111a2a;border-bottom:1px solid #1f2d46;font-size:13px;color:#e6f0ff}
.tmo{flex:1;overflow:auto;padding:8px 10px;white-space:pre-wrap;word-break:break-word;-webkit-overflow-scrolling:touch}
.tmo div{min-height:1.1em}.tmd{opacity:.55}
.tmc{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:#0d1522;border-top:1px solid #1f2d46;max-height:38%;overflow:auto}.tmc:empty{display:none}
.tmc button{background:#16233a;color:#e6f0ff;border:1px solid #2a3d63;border-radius:10px;padding:9px 11px;font:600 13px system-ui,sans-serif;flex:0 0 auto}
.tmc button:active{background:#24406e}
.tmi{display:none;gap:6px;padding:6px 8px;align-items:center;background:#0d1522;border-top:1px solid #1f2d46}
.tmp{color:#5dff9a;white-space:nowrap;max-width:55%;overflow:hidden;text-overflow:ellipsis}
.tmi input{flex:1;min-width:0;background:#0a0e14;border:1px solid #243350;color:#e6f0ff;font:16px ui-monospace,Menlo,Consolas,monospace;border-radius:8px;padding:8px 10px;outline:0}
.tmi button.b{padding:8px 12px}
.ta37{color:#cfd8e6}.ta34{color:#6ea8ff}.ta35{color:#d58bff}.ta33{color:#ffcf5a}.ta32{color:#4cd97b}.ta1_34{color:#6ea8ff;font-weight:700}
.ta1_31{color:#ff5c6c;font-weight:700}.ta1_36{color:#5ee7ff;font-weight:700}.ta1_33{color:#ffd84d;font-weight:700}.ta1_32{color:#5dff9a;font-weight:700}

.vdel{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:12px;border:0;background:rgba(10,10,20,.72);color:#fff;font-size:18px;backdrop-filter:blur(4px)}.vdel:active{background:#c4122a}
/* ================= 6.4: Design-Stil LucarioOS ================= */
.cy{font-weight:inherit}
.lohd,.lologo,.lowd,.lodots,#hgr{display:none}
#phone.lo{background:var(--lobg) center/cover no-repeat,radial-gradient(120% 70% at 85% 5%,rgb(var(--lomid)) 0,rgb(var(--lodk)) 55%,#02040f 100%)!important}
#phone.lo .lohd{display:flex;justify-content:space-between;align-items:flex-start;margin:0 0 4px;padding-left:12px;border-left:3px solid var(--lo)}
#phone.lo .lob b{display:block;font:400 28px/1.1 system-ui,sans-serif;letter-spacing:.3px}#phone.lo .lob b i{font-style:normal;color:var(--lo)}
#phone.lo .lob small{display:block;font-size:13px;opacity:.85;letter-spacing:.5px;margin-top:2px}
#phone.lo .lodate{display:flex;gap:10px;align-items:center;background:rgba(var(--lodk),.62);border:1px solid rgba(var(--lorgb),.42);border-radius:22px;padding:8px 16px;font-size:13px;backdrop-filter:blur(10px)}
#phone.lo .lodate b{display:block;font-weight:600}#phone.lo .lodate i{display:block;font-style:normal;color:var(--lo)}
#phone.lo .lologo{display:block;position:absolute;right:-14px;top:128px;width:170px;opacity:.95;pointer-events:none;filter:drop-shadow(0 0 18px rgba(var(--lorgb),.8))}
#phone.lo #clock{text-align:left;margin:20px 0 4px;position:relative;z-index:1}
#phone.lo #clock .t{font-size:84px;font-weight:300;letter-spacing:-3px;line-height:1}
#phone.lo #clock .cy{color:var(--lo)}
#phone.lo #clock .d{display:none}
#phone.lo #hgr{display:block;font-size:21px;opacity:.8;margin-top:8px}
#phone.lo #search{margin:12px 0 18px;padding:15px 52px 15px 48px;border-radius:28px;background:var(--losearch) 14px center/22px no-repeat,var(--lomic) right 16px center/22px no-repeat,rgba(var(--lodk),.62);border:1px solid rgba(var(--lorgb),.45);box-shadow:0 0 18px rgba(var(--lorgb),.28);color:#fff}
#phone.lo .app .ic{background:linear-gradient(150deg,rgba(var(--lorgb),.5),rgba(var(--lodk),.88))!important;border:1px solid rgba(var(--lorgb),.5);box-shadow:0 0 16px rgba(var(--lorgb),.38),inset 0 1px 0 rgba(255,255,255,.28)!important;border-radius:20px}
#phone.lo .app span{font-size:12px;text-shadow:0 1px 3px #000}
#phone.lo .ic svg{filter:drop-shadow(0 0 4px rgba(var(--lorgb),.7))}
#phone.lo #dock{background:rgba(var(--lodk),.62);border:1px solid rgba(var(--lorgb),.42);box-shadow:0 0 22px rgba(var(--lorgb),.32)}
#phone.lo .lowd{display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(var(--lodk),.62);border:1px solid rgba(var(--lorgb),.42);border-radius:26px;padding:12px 18px;margin:6px 0 8px;backdrop-filter:blur(12px)}
#phone.lo .lowd>div{display:flex;align-items:center;gap:10px;flex:1;font-size:13px}#phone.lo .lowd small{display:block;opacity:.85}#phone.lo .lowd b{display:block;font-size:18px}
#phone.lo .lowd .bar{height:8px;min-width:50px;background:rgba(255,255,255,.18);border-radius:6px;overflow:hidden;margin-top:4px}#phone.lo .lowd .bar i{display:block;height:100%;width:50%;background:linear-gradient(90deg,var(--lo),var(--lo2))}
#phone.lo .lowd .sep{flex:none;width:1px;align-self:stretch;background:rgba(255,255,255,.2)}

<script>

const LS=(()=>{try{const t='__t';localStorage.setItem(t,'1');localStorage.removeItem(t);return localStorage}catch(e){const m={};return new Proxy(m,{get:(t,k)=>k=='removeItem'?(x=>{delete m[x]}):k=='getItem'?(x=>m[x]===undefined?null:m[x]):k=='setItem'?((x,v)=>{m[x]=String(v)}):k=='clear'?(()=>{for(const x in m)delete m[x]}):m[k],set:(t,k,v)=>{m[k]=String(v);return true},deleteProperty:(t,k)=>{delete m[k];return true}})}})();

const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MEM={},KP={accounts:'name'};let useMem=false,memId=0;
function memSt(name,fn){
  const m=MEM[name]||(MEM[name]=new Map()),kp=KP[name]||'id';
  const key=v=>{if(kp=='id'&&v.id==null)v.id=++memId;return v[kp]};
  const s={add:v=>{const k=key(v);if(m.has(k)){const e=new Error('exists');e.name='ConstraintError';throw e}m.set(k,v);return{result:k}},put:v=>{const k=key(v);m.set(k,v);return{result:k}},get:k=>({result:m.get(k)}),getAll:()=>({result:[...m.values()]}),getAllKeys:()=>({result:[...m.keys()]}),delete:k=>{m.delete(k);return{result:undefined}},count:()=>({result:m.size})};
  try{return Promise.resolve(fn(s).result)}catch(e){return Promise.reject(e)}
}
async function st(name,mode,fn){
  if(useMem)return memSt(name,fn);
  let d;try{d=await DB()}catch(e){useMem=true;dbp=null;return memSt(name,fn)}
  return new Promise((res,rej)=>{const t=d.transaction(name,mode);const rq=fn(t.objectStore(name));t.oncomplete=()=>res(rq&&rq.result);t.onerror=e=>rej((e.target&&e.target.error)||t.error)});
}

const Sys={
  pidc:100,cur:null,hooks:{},session:null,call:null,focus:null,logs:[],t0:Date.now(),
  svc:[
    {pid:1,name:'kernel (Scheduler, MMU)',cls:'KERNEL',state:'RUNNING'},
    {pid:2,name:'uid (UI-Dienst)',cls:'INTERAKTIV',state:'RUNNING'},
    {pid:3,name:'audiod (Audio-Server)',cls:'ECHTZEIT',state:'BLOCKED'},
    {pid:4,name:'ril (Telefonie-Dienst)',cls:'ECHTZEIT',state:'BLOCKED'},
    {pid:5,name:'maild (Mail-Dämon)',cls:'HINTERGRUND',state:'BLOCKED'},
    {pid:6,name:'keystored (Schlüsselverwaltung)',cls:'INTERAKTIV',state:'BLOCKED'}],
  log(t){this.logs.unshift(new Date().toLocaleTimeString('de-DE')+'  '+t);if(this.logs.length>60)this.logs.length=60},
  s(pid){return this.svc.find(x=>x.pid==pid)},
  toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(this.tt);this.tt=setTimeout(()=>e.classList.remove('on'),3200)},
  spawn(a){this.cur={pid:++this.pidc,name:a.name,cls:'INTERAKTIV',state:'RUNNING',t:Date.now()};this.hooks={};this.log('exec '+a.name+' → PID '+this.cur.pid+' (INTERAKTIV)')},
  reap(){if(this.cur){this.log('exit PID '+this.cur.pid+' '+this.cur.name+' → ZOMBIE → entfernt');this.cur=null;this.hooks={}}},
  takeFocus(owner,pause){
    if(this.focus&&this.focus.owner!==owner&&this.focus.pause){try{this.focus.pause()}catch(e){}this.log('audiod: Audio-Fokus '+this.focus.owner+' → '+owner+' ('+this.focus.owner+' pausiert)')}
    this.focus={owner,pause}},
  dropFocus(owner){if(this.focus&&this.focus.owner===owner)this.focus=null},
  unlock(){try{if(!this.ctx)this.ctx=new (window.AudioContext||window.webkitAudioContext)();if(this.ctx.state=='suspended')this.ctx.resume()}catch(e){}},
  ring(on){
    clearInterval(this.ri);if(navigator.vibrate)navigator.vibrate(0);
    if(!on||!this.ctx)return;
    const burst=()=>{try{const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type='sine';o.frequency.value=880;g.gain.value=SET.sound?.3*SET.ringVol:0;o.connect(g);g.connect(this.ctx.destination);o.start();o.stop(this.ctx.currentTime+.4);if(navigator.vibrate&&SET.vibrate)navigator.vibrate([300,100,300])}catch(e){}};
    burst();this.ri=_si(burst,1800)},
  mailArrived(user){
    this.log('maild: IMAP-IDLE-Ereignis (EXISTS) → BLOCKED → RUNNING');const m=this.s(5);m.state='RUNNING';
    setTimeout(()=>{m.state='BLOCKED'},900);
    if(this.session&&this.session.name===user)this.toast('✉ Neue Nachricht in LucarioMail')},
  /* eingehender Anruf = Interrupt: ril (ECHTZEIT) verdrängt die Vordergrund-App */
  incoming(who){
    if(this.call)return;this.unlock();
    this.log('IRQ #57 Baseband-Mailbox → Top-Half quittiert, ril geweckt (BLOCKED → READY)');
    this.s(4).state='RUNNING';this.log('Scheduler: ril (ECHTZEIT) verdrängt '+(this.cur?this.cur.name:'UI'));
    if(this.cur){this.cur.state='READY';if(this.hooks.onPause){try{this.hooks.onPause()}catch(e){}}}
    this.s(3).state='RUNNING';this.takeFocus('call',null);
    this.call={who,state:'ring'};this.ring(true);this.callUI();
    clearTimeout(this.rt);this.rt=setTimeout(()=>{if(this.call&&this.call.state=='ring')this.hang()},25000)},
  outgoing(who){
    if(this.call)return;this.unlock();
    this.log('ril: DIAL → Modem');this.s(4).state='RUNNING';this.s(3).state='RUNNING';
    if(this.cur){this.cur.state='READY';if(this.hooks.onPause){try{this.hooks.onPause()}catch(e){}}}
    this.takeFocus('call',null);this.call={who,state:'dial',out:1};this.callUI();
    clearTimeout(this.rt);this.rt=setTimeout(()=>{if(this.call&&this.call.state=='dial')this.accept()},1800)},
  accept(){
    const c=this.call;if(!c)return;clearTimeout(this.rt);this.ring(false);c.state='active';c.t0=Date.now();
    this.log('ril: ANSWER → Modem; audiod: Voice-Pfad Codec ↔ Modem (PCM)');this.callUI()},
  hang(){
    const c=this.call;if(!c)return;clearTimeout(this.rt);
    const dur=c.state=='active'?Math.floor((Date.now()-c.t0)/1000):0;
    const type=c.state=='ring'?'missed':(c.out?'out':'in');
    try{const l=JSON.parse(LS.calls||'[]');l.unshift({who:c.who,type,t:Date.now(),dur});LS.calls=JSON.stringify(l.slice(0,50))}catch(e){}
    this.ring(false);this.call=null;this.s(4).state='BLOCKED';this.s(3).state='BLOCKED';this.dropFocus('call');
    this.log('ril: HANGUP · audiod: Voice-Pfad getrennt · Audio-Fokus freigegeben');
    if(this.cur){this.cur.state='RUNNING';this.log(this.cur.name+': READY → RUNNING (onResume)');if(this.hooks.onResume){try{this.hooks.onResume()}catch(e){}}}
    this.callUI()},
  testCall(){this.unlock();this.toast('Testanruf in 5 s – wechsle jetzt in eine andere App');setTimeout(()=>this.incoming('Anna (Test)'),5000)},
  callUI(){
    const c=this.call,el=$('#call');clearInterval(this.ct);
    if(!c){el.style.display='none';el.innerHTML='';return}
    el.style.display='flex';
    const label={ring:'Eingehender Anruf',dial:'Rufe an…',active:'Im Gespräch · 00:00'}[c.state];
    el.innerHTML='<div class="cav">'+esc((c.who[0]||'?').toUpperCase())+'</div><div style="font-size:26px;font-weight:600;word-break:break-all">'+esc(c.who)+'</div><div id="cl" style="opacity:.8;margin-top:6px">'+label+'</div><div style="flex:1"></div><div class="cbtns">'+(c.state=='ring'?'<button class="cb red" id="cd">✕</button><button class="cb green" id="ca">✆</button>':'<button class="cb red" id="cd">✆</button>')+'</div><div style="opacity:.5;font-size:11px;margin-top:18px">Simulation – kein echtes Mobilfunknetz</div>';
    $('#cd').onclick=()=>this.hang();const ca=$('#ca');if(ca)ca.onclick=()=>this.accept();
    if(c.state=='active')this.ct=_si(()=>{const s=Math.floor((Date.now()-c.t0)/1000);const l=$('#cl');if(l)l.textContent='Im Gespräch · '+String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000)}
};

function authReg(done){
  $('#af').innerHTML='<input class="f" id="rn" placeholder="Wunschname, z. B. luca" autocapitalize="off" autocomplete="off"><div id="rs" style="font-size:13px;min-height:20px;margin:2px 2px 8px"></div><input class="f" id="rp" type="password" placeholder="Passwort (mind. 8 Zeichen)" autocomplete="new-password"><div style="height:6px;border-radius:3px;background:var(--card);margin:4px 0 8px"><div id="pb" style="height:100%;width:0;border-radius:3px;transition:.2s"></div></div><input class="f" id="rp2" type="password" placeholder="Passwort wiederholen" autocomplete="new-password"><p style="opacity:.65;font-size:12px;line-height:1.4">Dein Passwort schützt deinen privaten Schlüssel. Es kann <b>nicht zurückgesetzt</b> werden – ohne Passwort sind deine Mails und Chats für immer unlesbar. Jeder Name existiert nur einmal.</p><button class="b" id="rg" style="width:100%">Konto erstellen</button><p id="rm" style="min-height:20px"></p>';
  const chk=async()=>{const s=await nameStatus($('#rn').value);const r=$('#rs');r.style.color=s.ok?'#2ecc71':'#ff8a8a';r.textContent=s.msg;return s};
  $('#rn').oninput=()=>{clearTimeout(authTimer);authTimer=setTimeout(chk,250)};
  $('#rp').oninput=()=>{const s=pwScore($('#rp').value);const b=$('#pb');b.style.width=(s*20)+'%';b.style.background=['#e74c3c','#e74c3c','#e67e22','#f1c40f','#2ecc71','#2ecc71'][s]};
  $('#rg').onclick=async()=>{
    const rm=$('#rm');rm.style.color='#ff8a8a';
    const s=await chk();if(!s.ok){rm.textContent=s.msg||'Bitte einen Namen wählen';return}
    const p=$('#rp').value;
    if(p.length<8){rm.textContent='Das Passwort braucht mindestens 8 Zeichen';return}
    if(pwScore(p)<2){rm.textContent='Passwort zu schwach – mische Buchstaben, Zahlen oder Sonderzeichen';return}
    if(p!==$('#rp2').value){rm.textContent='Die Passwörter stimmen nicht überein';return}
    rm.style.color='#9ad';rm.textContent='Schlüssel werden erzeugt…';$('#rg').disabled=true;
    try{
      Sys.session=await Cr.create($('#rn').value,p);
      Sys.log('keystored: RSA-2048-Schlüsselpaar für '+Sys.session.name+' erzeugt');
      const ad=Sys.session.name+'@lucario.net';
      const w=await Cr.seal({from:'team@lucario.net',to:ad,subject:'Willkommen bei LucarioMail 👋',body:'Hallo '+Sys.session.name+'!\n\nDein Konto wurde erstellt. Deine Adresse: '+ad+'\n\n• Dein Name existiert im ganzen System nur einmal.\n• Mails und Chats werden Ende-zu-Ende verschlüsselt gespeichert (AES-256-GCM + RSA-OAEP).\n• Dein Passwort kann nicht zurückgesetzt werden – bewahre es sicher auf.\n• Hinterlege deine Telefonnummer in Einstellungen → Konto & Telefonnummer.\n\nViel Spaß!\nDas LucarioNet-Team'},Sys.session.pub);
      await st('mails','readwrite',s=>s.add({owner:Sys.session.name,folder:'inbox',date:Date.now(),read:0,...w}));
      done();
    }catch(e){rm.style.color='#ff8a8a';rm.textContent=e.message||'Fehler beim Erstellen';$('#rg').disabled=false}
  };
}

/* ---------- 5.0: Gerätesperre, Startbildschirm, WLAN, Einrichtung ---------- */
const te=new TextEncoder();
async function factoryReset(){
  try{LS.clear()}catch(e){}
  try{if(typeof dbp!=='undefined'&&dbp){try{(await dbp).close()}catch(e){}}}catch(e){}
  await new Promise(res=>{try{const r=indexedDB.deleteDatabase('lucarionet');r.onsuccess=r.onerror=r.onblocked=()=>res();setTimeout(res,1500)}catch(e){res()}});
  try{const k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)))}catch(e){}
  location.reload();
}

/* ----- Netzwerk: Status, Verbindungstest, Pi-Helfer (nmcli) ----- */
const Net={
  helper:null,nets:null,
  async api(path,body,ms){
    const ac=new AbortController(),to=setTimeout(()=>ac.abort(),ms||8000);
    try{
      const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{'X-Lucario':'1','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store',signal:ac.signal});
      if(!(r.headers.get('content-type')||'').includes('json'))throw new Error('kein Helfer');
      const j=await r.json();if(!r.ok||j.ok===false)throw new Error(j.error||('Fehler '+r.status));return j;
    }finally{clearTimeout(to)}
  },
  async probe(){try{const j=await this.api('status');this.helper=true;return j}catch(e){this.helper=false;this.err=e&&e.message;return null}},
  info(){const c=navigator.connection||{};return{online:navigator.onLine!==false,eff:c.effectiveType,down:c.downlink,rtt:c.rtt,type:c.type}},
  async test(){
    const t0=performance.now(),ac=new AbortController(),to=setTimeout(()=>ac.abort(),6000);
    try{await fetch('https://www.gstatic.com/generate_204',{mode:'no-cors',cache:'no-store',signal:ac.signal});clearTimeout(to);return{ok:true,ms:Math.round(performance.now()-t0)}}
    catch(e){clearTimeout(to);return{ok:false}}
  },
  icon(){return navigator.onLine===false?'⚠️':'📶'},
  text(){return navigator.onLine===false?'Offline':'Online'},
  refresh(){
    const w=$('#wf');if(w){w.textContent=this.icon();w.title=this.text()}
    const c=$('#lkw');if(c)c.textContent=this.icon()+' '+this.text();
  },
  bars(s){return s>=75?'▂▄▆█':s>=50?'▂▄▆▁':s>=25?'▂▄▁▁':'▂▁▁▁'},
  open(){$('#wifi').classList.add('on');this.draw()},
  close(){$('#wifi').classList.remove('on')},
  async draw(){
    const el=$('#wifi'),i=this.info(),self=this;
    const esc2=esc;
    el.innerHTML='<div class="mh"><button class="g" id="wx">✕</button><b style="font-size:20px;flex:1">WLAN & Internet</b></div>'
      +'<div class="set"><div style="display:flex;align-items:center;gap:10px"><span style="font-size:28px">'+this.icon()+'</span><div style="flex:1"><b>'+this.text()+'</b><div style="opacity:.65;font-size:12px">'+(i.online?('Verbindung'+(i.type?': '+esc2(i.type):'')+(i.eff?' · '+esc2(i.eff).toUpperCase():'')+(i.down?' · ca. '+i.down+' Mbit/s':'')+(i.rtt?' · '+i.rtt+' ms':'')):'Keine Netzwerkverbindung erkannt')+'</div></div></div><button class="b" id="wt" style="margin-top:10px">Internet testen</button><div id="wtr" style="margin-top:8px;min-height:20px"></div></div><div id="whp" style="width:100%"><div class="set" style="opacity:.7">Suche WLAN-Helfer…</div></div>';
    $('#wx').onclick=()=>this.close();
    $('#wt').onclick=async()=>{const r=$('#wtr');r.textContent='Teste…';const t=await this.test();r.innerHTML=t.ok?'<span style="color:#2ecc71">✓ Internet erreichbar ('+t.ms+' ms)</span>':'<span style="color:#ff8a8a">✗ Kein Internet erreichbar</span>';this.refresh()};
    const st=await this.probe();if(!$('#wifi').classList.contains('on'))return;
    const hp=$('#whp');
    if(!st){
      const andr=/Android/i.test(navigator.userAgent);
      hp.innerHTML='<div class="set"><b>WLAN wählen</b><p style="margin:8px 0;opacity:.85;line-height:1.45">Auf diesem Gerät verwaltet das Betriebssystem darunter (Android/iOS/Browser) das WLAN. Netzwerke in der Nähe suchen und verbinden kann LucarioNet nur auf dem <b>Raspberry Pi</b> mit dem mitgelieferten <code>lucarionet-server.py</code>.</p>'+(andr?'<a class="b" href="intent://#Intent;action=android.settings.WIFI_SETTINGS;end" style="display:inline-block;text-decoration:none;padding:10px 16px">Android-WLAN-Einstellungen öffnen</a><p style="font-size:12px;opacity:.6;margin:8px 0 0">Funktioniert je nach Browser/Gerät nicht überall.</p>':'<p style="font-size:12px;opacity:.6;margin:0">Öffne dafür die WLAN-Einstellungen deines Geräts.</p>')+'</div>';
      return;
    }
    const draw2=(s)=>{
      hp.innerHTML='<div class="set"><div class="srow" style="padding-top:0"><div style="flex:1"><b>WLAN</b><div style="opacity:.65;font-size:12px">'+(s.ssid?'Verbunden mit <b>'+esc2(s.ssid)+'</b> · '+s.signal+' %'+(s.ip?' · '+esc2(s.ip):''):(s.ethernet?'Kabel verbunden':'Nicht verbunden'))+'</div></div><label class="tg"><input type="checkbox" id="wr"'+(s.radio?' checked':'')+'><span></span></label></div>'+(s.ssid?'<button class="g" id="wd">Trennen</button>':'')+'</div><div class="set"><div style="display:flex;align-items:center"><b style="flex:1">Netzwerke in der Nähe</b><button class="b" id="ws">Suchen</button></div><div id="wl" style="margin-top:8px;width:100%"></div><div id="wm" style="min-height:20px;margin-top:6px"></div></div><div class="set"><b>Hotspot (Internet teilen)</b><p style="margin:6px 0;opacity:.7;font-size:12px">Macht den Pi zu einem WLAN-Zugang für andere Geräte.</p><input class="f" id="hs" placeholder="Hotspot-Name" value="LucarioNet"><input class="f" id="hp" type="password" placeholder="Hotspot-Passwort (mind. 8 Zeichen)"><div style="display:flex;gap:8px;margin-top:6px"><button class="b" id="hon">Hotspot starten</button><button class="g" id="hoff">Beenden</button></div><div id="hm" style="min-height:20px;margin-top:6px"></div></div>';
      const msg=(id,t,ok)=>{const m=$(id);if(m)m.innerHTML='<span style="color:'+(ok?'#2ecc71':'#ff8a8a')+'">'+esc2(t)+'</span>'};
      $('#wr').onchange=async e=>{try{await self.api('radio',{on:e.target.checked});self.draw()}catch(x){msg('#wm',x.message)}};
      const wd=$('#wd');if(wd)wd.onclick=async()=>{try{await self.api('disconnect',{});self.draw()}catch(x){msg('#wm',x.message)}};
      const scan=async re=>{
        $('#ws').disabled=true;$('#wl').innerHTML='<div style="opacity:.7">Suche…</div>';
        try{const r=await self.api('scan'+(re?'?rescan=1':''),null,35000);self.nets=r.networks;listNets()}catch(x){msg('#wm',x.message);$('#wl').innerHTML=''}
        $('#ws').disabled=false;
      };
      const listNets=()=>{
        const l=$('#wl'),n=self.nets||[];
        l.innerHTML=n.length?n.map((x,k)=>'<div class="mi" data-i="'+k+'" style="padding:10px 4px"><div class="e">'+(x.active?'✅':'📶')+'</div><div style="flex:1;min-width:0"><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc2(x.ssid)+'</div><div style="opacity:.6;font-size:12px">'+self.bars(x.signal)+' '+x.signal+' %'+(x.security?' · '+esc2(x.security):' · offen')+(x.saved?' · gespeichert':'')+'</div></div><span>'+(x.security?'🔒':'')+'</span></div>').join(''):'<div style="opacity:.7">Keine Netzwerke gefunden.</div>';
        l.querySelectorAll('[data-i]').forEach(d=>d.onclick=()=>pick(n[+d.dataset.i]));
      };
      const pick=x=>{
        const need=x.security&&!x.saved&&!x.active;
        $('#wl').innerHTML='<div style="padding:6px 0"><b>'+esc2(x.ssid)+'</b>'+(need?'<input class="f" id="wp" type="password" placeholder="WLAN-Passwort" autocomplete="off">':'')+'<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button class="b" id="wc">'+(x.active?'Neu verbinden':'Verbinden')+'</button>'+(x.saved?'<button class="g" id="wf2">Vergessen</button>':'')+'<button class="g" id="wb">Zurück</button></div></div>';
        $('#wb').onclick=listNets;
        const wf2=$('#wf2');if(wf2)wf2.onclick=async()=>{try{await self.api('forget',{ssid:x.ssid});x.saved=false;listNets();msg('#wm','Netzwerk vergessen',1)}catch(e){msg('#wm',e.message)}};
        $('#wc').onclick=async()=>{
          const pw=need?$('#wp').value:'';$('#wc').disabled=true;msg('#wm','Verbinde…',1);
          try{await self.api('connect',{ssid:x.ssid,password:pw},65000);msg('#wm','Verbunden mit '+x.ssid,1);self.refresh();setTimeout(()=>self.draw(),800)}
          catch(e){msg('#wm',e.message);$('#wc').disabled=false}
        };
      };
      $('#ws').onclick=()=>scan(true);
      $('#hon').onclick=async()=>{try{await self.api('hotspot',{ssid:$('#hs').value,password:$('#hp').value},65000);msg('#hm','Hotspot aktiv',1)}catch(x){msg('#hm',x.message)}};
      $('#hoff').onclick=async()=>{try{await self.api('hotspot_off',{});msg('#hm','Hotspot beendet',1)}catch(x){msg('#hm',x.message)}};
      if(self.nets)listNets();else scan(false);
    };
    draw2(st);
  }
};

/* ----- Gerätesperre: PIN oder Passwort ----- */
const Lock={
  tries:0,hid:0,shown:false,iv:0,
  cfg(){try{const c=JSON.parse(LS.lockcfg||'null');if(c)return c;const o=JSON.parse(LS.pin||'null');return o?{type:'pin',len:o.len,salt:o.salt,hash:o.hash,it:100000}:null}catch(e){return null}},
  has(){return !!this.cfg()},
  async hash(s,salt,it){const k=await crypto.subtle.importKey('raw',te.encode(s),'PBKDF2',false,['deriveBits']);return hex(new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:unhex(salt),iterations:it||100000,hash:'SHA-256'},k,256)))},
  async set(secret,type){
    if(!type)type=/^\d{4,6}$/.test(secret)?'pin':'pw';
    const salt=hex(crypto.getRandomValues(new Uint8Array(16)));
    LS.lockcfg=JSON.stringify({type,len:secret.length,salt,hash:await this.hash(secret,salt,150000),it:150000});LS.removeItem('pin');LS.removeItem('lockfail');
  },
  async check(s){const c=this.cfg();if(!c)return true;return (await this.hash(s,c.salt,c.it||100000))===c.hash},
  clear(){LS.removeItem('lockcfg');LS.removeItem('pin');LS.removeItem('lockfail')},
  fails(){try{return JSON.parse(LS.lockfail||'{"n":0,"until":0}')}catch(e){return{n:0,until:0}}},
  async attempt(secret){
    const f=this.fails();
    if(Date.now()<f.until)return'Gesperrt – noch '+Math.ceil((f.until-Date.now())/1000)+' s';
    if(await this.check(secret)){LS.removeItem('lockfail');this.hide();return''}
    f.n++;if(f.n>=5)f.until=Date.now()+(f.n>=10?300000:30000);LS.lockfail=JSON.stringify(f);
    return(this.cfg().type=='pin'?'Falsche PIN':'Falsches Passwort')+(f.n>=5?' – gesperrt':' ('+f.n+'/5)');
  },
  hide(){const el=$('#lock');el.style.display='none';el.innerHTML='';this.shown=false;clearInterval(this.iv)},
  show(){
    const el=$('#lock'),self=this;let mode='home',pin='',note='';
    this.shown=true;el.style.display='flex';
    const bat=()=>{const b=$('#bt');return b?b.textContent:''};
    const timeStr=()=>new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
    const dateStr=()=>new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
    const top=()=>'<div class="lkt"><button class="lkc" id="lkw">'+Net.icon()+' '+Net.text()+'</button><span id="lkb">'+esc(bat())+'</span></div>';
    const clock=()=>'<div class="lkk" id="lkt">'+timeStr()+'</div><div class="lkd" id="lkd">'+esc(dateStr())+'</div>';
    const wire=()=>{const w=$('#lkw');if(w)w.onclick=()=>Net.open()};
    const homeView=()=>{
      const c=self.cfg();
      el.innerHTML=top()+clock()+'<div id="lka" style="flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;cursor:pointer"><div class="lkh">'+(c?'🔒':'🔓')+'<br>'+(c?'Zum Entsperren tippen oder nach oben wischen':'Tippen oder nach oben wischen')+'</div></div><div class="lkf"><a class="lkc" href="tel:112" style="text-decoration:none">🚨 Notruf</a>'+(c?'<button class="lkc" id="lkv">Code vergessen?</button>':'')+'</div>';
      wire();let y0=null;const a=$('#lka');
      a.onclick=go;a.onpointerdown=e=>{y0=e.clientY};a.onpointerup=e=>{if(y0!==null&&y0-e.clientY>50)go();y0=null};
      const v=$('#lkv');if(v)v.onclick=forgot;
    };
    const go=()=>{if(!self.cfg()){self.hide();return}mode='entry';pin='';entry()};
    const entry=msg=>{
      const c=self.cfg();note=msg||'';
      if(c.type=='pin'){
        el.innerHTML=top()+'<div class="lkk" style="font-size:44px;margin-top:40px">'+timeStr()+'</div><div style="opacity:.85;min-height:22px;margin-top:16px" id="lkm">'+esc(note||'PIN eingeben')+'</div><div class="dots">'+Array.from({length:c.len},(_,i)=>'<i class="'+(i<pin.length?'on':'')+'"></i>').join('')+'</div><div class="keys">'+['1','2','3','4','5','6','7','8','9','','0','⌫'].map(k=>k?'<button data-k="'+k+'">'+k+'</button>':'<span></span>').join('')+'</div><div class="lkf"><button class="lkc" id="lkx">Zurück</button><button class="lkc" id="lkv">Code vergessen?</button></div>';
        el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>press(b.dataset.k));
      }else{
        el.innerHTML=top()+'<div class="lkk" style="font-size:44px;margin-top:40px">'+timeStr()+'</div><div style="opacity:.85;min-height:22px;margin-top:16px" id="lkm">'+esc(note||'Passwort eingeben')+'</div><div style="display:flex;gap:8px;width:86%;margin-top:14px"><input class="f" id="lkp" type="password" placeholder="Passwort" autocomplete="current-password" style="margin:0"><button class="lkc" id="lke" style="padding:0 14px">👁</button></div><button class="b" id="lkg" style="width:86%;margin-top:12px">Entsperren</button><div style="flex:1"></div><div class="lkf"><button class="lkc" id="lkx">Zurück</button><button class="lkc" id="lkv">Code vergessen?</button></div>';
        const p=$('#lkp');p.focus();
        const sub=async()=>{const m=await self.attempt(p.value);if(m){p.value='';entry(m)}};
        $('#lkg').onclick=sub;p.onkeydown=e=>{if(e.key=='Enter')sub()};
        $('#lke').onclick=()=>{p.type=p.type=='password'?'text':'password'};
      }
      wire();$('#lkx').onclick=()=>{mode='home';homeView()};$('#lkv').onclick=forgot;
    };
    const press=async k=>{
      const c=self.cfg();
      if(k=='⌫')pin=pin.slice(0,-1);else if(pin.length<c.len)pin+=k;
      if(pin.length<c.len){entry();return}
      const typed=pin;pin='';const m=await self.attempt(typed);if(m)entry(m);
    };
    const forgot=()=>{
      el.innerHTML=top()+'<div style="width:86%;margin-top:60px;line-height:1.5"><div style="font-size:22px;font-weight:700;margin-bottom:10px">Code vergessen?</div>Es gibt bewusst keinen Hintertür-Zugang. Du kannst dieses Gerät nur <b>zurücksetzen</b> – dabei werden <b>alle Daten auf diesem Gerät gelöscht</b> (Konten, Nachrichten, Fotos, Einstellungen).<input class="f" id="lkr" placeholder="Tippe ZURÜCKSETZEN" autocomplete="off" style="margin-top:14px"><button class="b" id="lkd2" style="width:100%;margin-top:8px;background:#e74c3c;color:#fff">Gerät zurücksetzen</button><button class="g" id="lkn" style="width:100%;margin-top:8px">Abbrechen</button><div id="lkz" style="min-height:20px;margin-top:6px;color:#ff8a8a"></div></div>';
      wire();$('#lkn').onclick=homeView;
      $('#lkd2').onclick=()=>{if($('#lkr').value.trim().toUpperCase()=='ZURÜCKSETZEN')factoryReset();else $('#lkz').textContent='Bitte ZURÜCKSETZEN eintippen'};
    };
    homeView();
    clearInterval(this.iv);
    this.iv=_si(()=>{const t=$('#lkt');if(t){t.textContent=timeStr();const d=$('#lkd');if(d)d.textContent=dateStr()}const b=$('#lkb');if(b)b.textContent=bat()},5000);
  }
};
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){Lock.hid=Date.now();return}
  if(Lock.has()&&!Lock.shown&&SET.autolock>=0&&Lock.hid&&Date.now()-Lock.hid>=SET.autolock*60000)Lock.show();
});

/* ----- Einrichtungs-Assistent (erster Start) ----- */
const Setup={
  need(){return !LS.setupDone},
  run(done){
    const el=$('#setup');el.style.display='flex';let step=0;const N=6;
    const finish=()=>{LS.setupDone=1;el.style.display='none';el.innerHTML='';if(done)done()};
    const frame=(icon,title,body,btns)=>{
      el.innerHTML='<div class="sup">'+Array.from({length:N},(_,i)=>'<i class="'+(i<=step?'on':'')+'"></i>').join('')+'</div><div class="sub"><div style="font-size:54px;text-align:center">'+icon+'</div><div style="font-size:24px;font-weight:800;text-align:center;margin:8px 0 12px">'+title+'</div>'+body+'</div><div class="suf">'+btns+'</div>';
    };
    const next=()=>{step++;draw()};
    const draw=()=>{
      if(step==0){
        frame('⬡','Willkommen bei LucarioNet','<p style="text-align:center;opacity:.8;line-height:1.5">Dein eigenes Handy-Betriebssystem. In wenigen Schritten richten wir WLAN, Design, Sperre und dein Konto ein.</p>','<button class="b" id="s1" style="width:100%">Los geht’s</button>');
        $('#s1').onclick=next;
      }else if(step==1){
        const i=Net.info();
        frame('📶','Internet','<p style="text-align:center;opacity:.8;line-height:1.5">Status: <b>'+Net.text()+'</b>'+(i.online?'':'<br>Verbinde dich mit einem WLAN, um Wetter, Browser und KI zu nutzen.')+'</p><button class="g" id="s2" style="width:100%">WLAN-Menü öffnen</button>','<button class="b" id="s3" style="width:100%">Weiter</button>');
        $('#s2').onclick=()=>Net.open();$('#s3').onclick=next;
      }else if(step==2){

function loop60(update,draw){let last=performance.now(),acc=0,raf;const f=t=>{acc+=Math.min(100,t-last);last=t;while(acc>=16.667){update();acc-=16.667}draw();raf=requestAnimationFrame(f)};raf=requestAnimationFrame(f);return()=>cancelAnimationFrame(raf)}
A.snake=el=>{
  const N=20,S=Math.min(size(),400),c=document.createElement('canvas');c.width=c.height=S;
  el.innerHTML=`<div class="gh"><span id="sc">Punkte: 0</span><span>Rekord: ${hi('snake')}</span></div>`;el.appendChild(c);
  el.insertAdjacentHTML('beforeend',`<div class="pad"><button class="u">▲</button><button class="l">◀</button><button class="d">▼</button><button class="r">▶</button></div><button class="b" id="rs">Neustart</button>`);
  const x=c.getContext('2d'),u=S/N;let s,d,nd,f,sc,over,iv,started=false;
  function init(){s=[[10,10],[9,10],[8,10]];d=nd=[1,0];sc=0;over=false;started=false;food();$('#sc').textContent='Punkte: 0'}
  function food(){do{f=[Math.random()*N|0,Math.random()*N|0]}while(s.some(p=>p[0]==f[0]&&p[1]==f[1]))}
  const dir={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]};
  function set(k){const n=dir[k];started=true;if(n[0]+d[0]||n[1]+d[1])nd=n}
  function step(){if(over)return;if(!started){draw();return}d=nd;const h=[s[0][0]+d[0],s[0][1]+d[1]];
    if(h[0]<0||h[1]<0||h[0]>=N||h[1]>=N||s.some(p=>p[0]==h[0]&&p[1]==h[1])){over=true;hi('snake',sc);draw();return}
    s.unshift(h);if(h[0]==f[0]&&h[1]==f[1]){sc++;$('#sc').textContent='Punkte: '+sc;food()}else s.pop();draw()}
  function draw(){x.fillStyle='#0a0d18';x.fillRect(0,0,S,S);
    x.fillStyle='#ff5252';x.beginPath();x.arc((f[0]+.5)*u,(f[1]+.5)*u,u*.4,0,7);x.fill();
    s.forEach((p,i)=>{x.fillStyle=i?'#2ecc71':'#7dffb0';x.beginPath();x.roundRect(p[0]*u+1,p[1]*u+1,u-2,u-2,5);x.fill()});
    if(!started&&!over){x.fillStyle='#fff';x.font='bold 18px sans-serif';x.textAlign='center';x.fillText('Tippe oder wische zum Starten',S/2,S/2+60)}
    if(over){x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,0,S,S);x.fillStyle='#fff';x.font='bold 26px sans-serif';x.textAlign='center';x.fillText('Game Over – '+sc,S/2,S/2)}}
  el.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>set(b.className));
  swipe(c,set);$('#rs').onclick=init;
  const kh=e=>{const m={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r'}[e.key];if(m)set(m)};addEventListener('keydown',kh);
  init();iv=setInterval(step,115);return()=>{clearInterval(iv);removeEventListener('keydown',kh)};
};

    pipes.forEach(p=>{p.x-=2;if(!p.s&&p.x<60){p.s=1;sc++;$('#sc').textContent=sc}
      if(p.x<84&&p.x>40&&(y<p.g||y>p.g+120))over=true});pipes=pipes.filter(p=>p.x>-50);if(y<0||y>H)over=true;if(over)hi('flappy',sc)}}
  function draw(){
    x.fillStyle='#0f1b3d';x.fillRect(0,0,W,H);
    pipes.forEach(p=>{x.fillStyle='#2ecc71';x.fillRect(p.x,0,44,p.g);x.fillRect(p.x,p.g+120,44,H)});
    x.font='30px sans-serif';x.fillText('🐺',48,(started?y:H/2+Math.sin(Date.now()/250)*6)+10);if(!started&&!over){x.fillStyle='#fff';x.font='bold 18px sans-serif';x.textAlign='center';x.fillText('Tippen zum Starten',W/2,H/2+60);x.textAlign='left'}
    if(over){x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.font='bold 22px sans-serif';x.textAlign='center';x.fillText('Game Over – tippen',W/2,H/2);x.textAlign='left'}}
  init();const stop=loop60(upd,draw);return()=>{stop();removeEventListener('keydown',kh)};
};

A.music=el=>{

  el.innerHTML=`<div class="cover" id="cv">🎵</div><div id="tt" style="font-size:18px;font-weight:600;text-align:center;padding:0 16px;min-height:26px">Kein Titel</div>

  async function load(){urls.forEach(URL.revokeObjectURL);urls=[];list=await st('music','readonly',s=>s.getAll());

      d.onclick=()=>play(i);d.querySelector('.x').onclick=async e=>{e.stopPropagation();await st('music','readwrite',s=>s.delete(m.id));if(i==cur){au.pause();cur=-1}load()};$('#ls').appendChild(d)})}
  function play(i){if(!list.length)return;cur=(i+list.length)%list.length;au.src=urls[cur];Sys.takeFocus('music',()=>au.pause());au.play();$('#tt').textContent=list[cur].name;$('#cv').textContent='🎶';[...$('#ls').children].forEach((d,j)=>d.classList.toggle('on',j==cur))}
  $('#imp').onchange=async e=>{for(const f of e.target.files)await st('music','readwrite',s=>s.add({blob:f,name:f.name.replace(/\.[^.]+$/,'')}));load()};
  $('#pl').onclick=()=>{if(cur<0)play(0);else au.paused?au.play():au.pause()};$('#nx').onclick=()=>play(cur+1);$('#pv').onclick=()=>play(cur-1);
  au.onplay=()=>$('#pl').textContent='⏸';au.onpause=()=>$('#pl').textContent='▶';au.onended=()=>play(cur+1);
  au.ontimeupdate=()=>{if(au.duration)$('#sk').value=au.currentTime/au.duration*100};$('#sk').oninput=e=>{if(au.duration)au.currentTime=e.target.value/100*au.duration};
  $('#vo').oninput=e=>au.volume=e.target.value;au.volume=.8;
  load();return()=>{au.pause();Sys.dropFocus('music');urls.forEach(URL.revokeObjectURL)};

A.messenger=el=>{
  let poll=null,peer=null,count=-1;
  const hm=t=>new Date(t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
  const fmt=t=>{const d=new Date(),x=new Date(t);return x.toDateString()==d.toDateString()?hm(t):x.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})};
  const mine=async()=>(await st('msgs','readonly',s=>s.getAll())).filter(r=>r.owner===Sys.session.name);
  function start(){if(!Sys.session){authUI(el,'login',start,'💬 Messenger');return}el.style.overflow='auto';chats()}

  async function chats(tab){
    tab=tab||'chats';clearInterval(poll);peer=null;count=-1;Sys.hooks={};el.style.overflow='auto';
    const m=Sys.session,all=(await mine()).sort((a,b)=>b.date-a.date);
    const accs=await st('accounts','readonly',s=>s.getAll());
    const by={};all.forEach(r=>{(by[r.peer]=by[r.peer]||[]).push(r)});
    const peers=Object.keys(by).sort((a,b)=>by[b][0].date-by[a][0].date);
    const prev=await Promise.all(peers.map(p=>Cr.open(by[p][0],m.priv).then(x=>x.text).catch(()=>'🔒')));
    const my=accs.find(x=>x.name==m.name)||{};
    el.innerHTML='<div class="mh"><div style="flex:1;min-width:0"><b style="font-size:19px">💬 Messenger</b><div style="opacity:.65;font-size:12px">'+esc(m.name)+(my.phone?' · '+esc(my.phone):'')+'</div></div><button class="g" id="lo">Abmelden</button><button class="b" id="nc">＋</button></div>'+(my.phone?'':'<div class="set" style="display:flex;align-items:center;gap:10px"><span style="font-size:22px">📞</span><div style="flex:1;font-size:13px">Füge deine Telefonnummer hinzu, damit dich andere finden.</div><button class="b" id="ap">Hinzufügen</button></div>')+'<div class="tabs"><button class="'+(tab=='chats'?'b':'g')+'" id="t1">Chats</button><button class="'+(tab=='link'?'b':'g')+'" id="t2">Verknüpft</button></div><div id="ml" style="width:100%"></div>';
    $('#lo').onclick=()=>{Sys.session=null;badges();start()};
    $('#nc').onclick=newChat;
    const ap=$('#ap');if(ap)ap.onclick=()=>{Sys.openPage='acct';openApp('settings')};
    $('#t1').onclick=()=>chats('chats');$('#t2').onclick=()=>chats('link');
    if(tab=='link'){linked();return}
    const ml=$('#ml');
    if(!peers.length)ml.innerHTML='<p style="text-align:center;opacity:.6;padding:40px 20px">Noch keine Chats.<br>Tippe auf ＋ und gib eine Telefonnummer oder einen Benutzernamen ein.</p>';
    peers.forEach((p,i)=>{
      const un=by[p].filter(r=>r.dir=='in'&&!r.read).length,a=accs.find(x=>x.name==p)||{name:p};
      const d=document.createElement('div');d.className='mrow';
      d.innerHTML='<div class="av">'+esc((p[0]||'?').toUpperCase())+'</div><div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;gap:6px"><b style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(p)+(a.phone?' <span style="opacity:.5;font-weight:400;font-size:12px">'+esc(a.phone)+'</span>':'')+'</b><span style="opacity:.5;font-size:12px">'+fmt(by[p][0].date)+'</span></div><div style="opacity:.65;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'+(un?';font-weight:700;opacity:1':'')+'">'+esc(prev[i])+'</div></div>'+(un?'<div class="bd" style="position:static;display:grid">'+un+'</div>':'');
      d.onclick=()=>chat(a);ml.appendChild(d);
    });
  }

  async function resolve(q){
    q=String(q).trim().toLowerCase().replace(/@lucario\.net$/,'');if(!q)return null;
    const accs=await st('accounts','readonly',s=>s.getAll());
    const np=normPhone(q);if(np){const o=accs.find(a=>a.phone===np);if(o)return o}
    return accs.find(a=>a.name===q)||null;
  }
  function newChat(){
    clearInterval(poll);el.style.overflow='auto';
    el.innerHTML='<button class="g" id="bk" style="margin:8px 12px;align-self:flex-start">‹ Chats</button><div style="width:100%;padding:8px 16px"><b style="font-size:18px">Neuer Chat</b><input class="f" id="q" placeholder="Telefonnummer oder Benutzername" autocapitalize="off"><button class="b" id="go" style="width:100%;margin-top:6px">Chat starten</button><p id="nm" style="min-height:20px"></p><p style="opacity:.55;font-size:12px">Gefunden werden Konten auf diesem Gerät. Für andere Dienste (WhatsApp, Telegram …) nutze den Tab „Verknüpft“.</p></div>';
    $('#bk').onclick=()=>chats();
    $('#go').onclick=async()=>{const p=await resolve($('#q').value);if(!p){$('#nm').style.color='#ff8a8a';$('#nm').textContent='Kein Konto mit dieser Nummer oder diesem Namen gefunden.';return}chat(p)};
  }

  async function chat(p){
    clearInterval(poll);peer=p;count=-1;Sys.hooks={};el.style.overflow='hidden';
    el.innerHTML='<div class="mh"><button class="g" id="bk">‹</button><div class="av" style="width:36px;height:36px">'+esc((p.name[0]||'?').toUpperCase())+'</div><div style="flex:1;min-width:0"><b>'+esc(p.name)+'</b><div style="opacity:.6;font-size:12px">'+esc(p.phone||'keine Nummer')+'</div></div><button class="g" id="cl">✆</button><button class="g" id="dl">🗑</button></div><div id="mg" class="msgs"></div><div class="mi2"><input type="text" id="tx" placeholder="Nachricht…" autocomplete="off"><button class="b" id="sn">➤</button></div>';
    $('#bk').onclick=()=>chats();
    $('#cl').onclick=()=>Sys.outgoing(p.name+(p.phone?' ('+p.phone+')':''));
    $('#dl').onclick=async()=>{if(!confirm('Diesen Chat löschen?'))return;const rs=(await mine()).filter(r=>r.peer==p.name);for(const r of rs)await st('msgs','readwrite',s=>s.delete(r.id));chats()};
    const send=async()=>{
      const t=$('#tx').value.trim();if(!t)return;$('#tx').value='';
      const m=Sys.session,now=Date.now(),pk=await Cr.pubOf(p.name);
      if(!pk){Sys.toast('Empfänger nicht gefunden');return}
      if(p.name!==m.name){const sr=await Cr.seal({text:t},pk);await st('msgs','readwrite',s=>s.add({owner:p.name,peer:m.name,dir:'in',date:now,read:0,...sr}))}
      const ss=await Cr.seal({text:t},m.pub);await st('msgs','readwrite',s=>s.add({owner:m.name,peer:p.name,dir:'out',date:now,read:1,...ss}));
      Sys.log('messenger: Nachricht an '+p.name+' verschlüsselt gesendet');
      render();
    };
    $('#sn').onclick=send;$('#tx').onkeydown=e=>{if(e.key=='Enter')send()};
    await render();poll=setInterval(render,2000);
  }
  async function render(){
    if(!peer||!Sys.session)return;const m=Sys.session,box=$('#mg');if(!box)return;
    const rs=(await mine()).filter(r=>r.peer==peer.name).sort((a,b)=>a.date-b.date);
    if(rs.length==count)return;count=rs.length;
    const items=await Promise.all(rs.map(async r=>{
      if(r.dir=='in'&&!r.read){r.read=1;await st('msgs','readwrite',s=>s.put(r))}
      return{r,o:await Cr.open(r,m.priv).catch(()=>({text:'🔒 nicht lesbar'}))};
    }));
    box.innerHTML=items.map(({r,o})=>'<div class="bub '+(r.dir=='out'?'out':'in')+'">'+esc(o.text).replace(/\n/g,'<br>')+'<span>'+hm(r.date)+'</span></div>').join('')||'<p style="text-align:center;opacity:.6;padding:30px">Noch keine Nachrichten. Sag Hallo 👋</p>';
    box.scrollTop=box.scrollHeight;badges();

/* ================= RECHNER ================= */
A.calc=el=>{
  let ex='';
  const keys=['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','±','0',',','='];
  el.innerHTML='<div style="width:100%;padding:16px 18px 6px;text-align:right;min-height:130px;display:flex;flex-direction:column;justify-content:flex-end"><div id="ex" style="opacity:.6;font-size:18px;min-height:24px;word-break:break-all"></div><div id="rs" style="font-size:46px;font-weight:300;word-break:break-all">0</div></div><div class="ck" id="ck"></div>';
  const calc=s=>{const t=s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/,/g,'.').replace(/(\d+(\.\d+)?)%/g,'($1/100)');if(!/^[0-9+\-*/().\s]+$/.test(t))throw 0;const v=Function('"use strict";return ('+t+')')();if(!isFinite(v))throw 0;return +v.toFixed(10)};
  const show=()=>{$('#ex').textContent=ex;let r='';try{if(ex)r=String(calc(ex)).replace('.',',')}catch(e){r=''}$('#rs').textContent=r||(ex?'…':'0')};
  keys.forEach(k=>{const b=document.createElement('button');b.textContent=k;if('÷×−+='.includes(k))b.className='op';
    b.onclick=()=>{
      if(k=='C')ex='';else if(k=='⌫')ex=ex.slice(0,-1);
      else if(k=='='){try{ex=String(calc(ex)).replace('.',',')}catch(e){$('#rs').textContent='Fehler';return}}
      else if(k=='±')ex=ex.startsWith('−')?ex.slice(1):'−'+ex;
      else{if('÷×−+'.includes(k)&&/[÷×−+]$/.test(ex))ex=ex.slice(0,-1);ex+=k}
      show();
    };$('#ck').appendChild(b)});
  show();
};

};

/* ================= NEUE STORE-APPS ================= */
A.connect4=el=>{
  const R=6,C=7;let b,over,busy;
  const D=[[0,1],[1,0],[1,1],[1,-1]];
  const win=(b,p)=>{for(let r=0;r<R;r++)for(let c=0;c<C;c++)for(const [dr,dc] of D){let k=0;for(;k<4;k++){const rr=r+dr*k,cc=c+dc*k;if(rr<0||rr>=R||cc<0||cc>=C||b[rr][cc]!=p)break}if(k==4)return true}return false};
  const drop=(b,c,p)=>{for(let r=R-1;r>=0;r--)if(!b[r][c]){b[r][c]=p;return r}return -1};
  const score=b=>{let s=0;const w=a=>{const x=a.filter(v=>v==2).length,h=a.filter(v=>v==1).length;if(x&&h)return 0;return x==3?5:x==2?2:h==3?-4:h==2?-1:0};
    for(let r=0;r<R;r++){if(b[r][3]==2)s+=3;for(let c=0;c<C;c++)for(const [dr,dc] of D){const a=[];for(let k=0;k<4;k++){const rr=r+dr*k,cc=c+dc*k;if(rr<0||rr>=R||cc<0||cc>=C)break;a.push(b[rr][cc])}if(a.length==4)s+=w(a)}}return s};
  const mm=(b,d,al,be,max)=>{
    if(win(b,2))return 1000+d;if(win(b,1))return -1000-d;
    const cols=[3,2,4,1,5,0,6].filter(c=>!b[0][c]);if(!cols.length)return 0;if(d==0)return score(b);
    if(max){let v=-1e9;for(const c of cols){const r=drop(b,c,2);v=Math.max(v,mm(b,d-1,al,be,false));b[r][c]=0;al=Math.max(al,v);if(al>=be)break}return v}
    let v=1e9;for(const c of cols){const r=drop(b,c,1);v=Math.min(v,mm(b,d-1,al,be,true));b[r][c]=0;be=Math.min(be,v);if(al>=be)break}return v};
  const ai=()=>{let best=-1e9,bc=3;for(const c of [3,2,4,1,5,0,6]){if(b[0][c])continue;const r=drop(b,c,2);const v=mm(b,3,-1e9,1e9,false);b[r][c]=0;if(v>best){best=v;bc=c}}drop(b,bc,2)};
  el.innerHTML='<div class="gh"><span id="ms">Du bist Rot – tippe auf eine Spalte</span><button class="g" id="rs">↺</button></div><div id="bd" class="c4"></div>';
  function draw(){
    $('#bd').innerHTML=Array.from({length:C},(_,c)=>'<div class="col" data-c="'+c+'">'+Array.from({length:R},(_,r)=>'<i style="background:'+(['var(--card)','#ff4d4d','#ffd32a'][b[r][c]])+'"></i>').join('')+'</div>').join('');
    $('#bd').querySelectorAll('[data-c]').forEach(d=>d.onclick=()=>play(+d.dataset.c));
    const m=$('#ms');if(win(b,1))m.textContent='Du gewinnst! 🎉';else if(win(b,2))m.textContent='Die KI gewinnt';else if(b[0].every(v=>v))m.textContent='Unentschieden'}
  function play(c){
    if(over||busy||b[0][c])return;drop(b,c,1);draw();
    if(win(b,1)||b[0].every(v=>v)){over=true;return}

/* ---------- LUCARIOID: Konten, Namen, Kryptografie ---------- */
const enc=new TextEncoder(),dec=new TextDecoder();
const RESERVED=['admin','administrator','root','system','team','support','postmaster','webmaster','lucario','lucarionet','lucariomail','lucariotube','kernel','daemon','security','noreply','info','mail','nobody','guest','user','abuse','hostmaster','service'];
const canon=n=>String(n).toLowerCase().replace(/[._-]/g,'');
const nameOK=n=>/^[a-z0-9][a-z0-9._-]{2,19}$/.test(n);
const pwScore=p=>{let s=0;if(p.length>=8)s++;if(p.length>=12)s++;if(/[a-z]/.test(p)&&/[A-Z]/.test(p))s++;if(/\d/.test(p))s++;if(/[^A-Za-z0-9]/.test(p))s++;return s};
async function nameStatus(raw){
  const n=String(raw).trim().toLowerCase();
  if(!n)return{ok:false,msg:''};
  if(!nameOK(n))return{ok:false,msg:'3–20 Zeichen: a–z, 0–9, Punkt, _ und - (nicht am Anfang)'};
  if(RESERVED.some(r=>canon(r)==canon(n)))return{ok:false,msg:'Dieser Name ist für das System reserviert'};
  const keys=await st('accounts','readonly',s=>s.getAllKeys());
  if(keys.some(k=>canon(k)==canon(n)))return{ok:false,msg:'Name bereits vergeben (oder zu ähnlich zu einem vergebenen Namen)'};
  return{ok:true,msg:'✓ Frei: '+n+'@lucario.net'};
}
const Cr={
  async derive(pw,salt){const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},k,512))},
  async create(name,pw){
    name=String(name).trim().toLowerCase();
    const ns=await nameStatus(name);if(!ns.ok)throw new Error(ns.msg||'Ungültiger Name');
    if(pw.length<8)throw new Error('Das Passwort braucht mindestens 8 Zeichen');
    const salt=crypto.getRandomValues(new Uint8Array(16));
    const d=await Cr.derive(pw,salt),hash=d.slice(0,32);
    const wk=await crypto.subtle.importKey('raw',d.slice(32),'AES-GCM',false,['encrypt']);
    const kp=await crypto.subtle.generateKey({name:'RSA-OAEP',modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:'SHA-256'},true,['encrypt','decrypt']);
    const pub=await crypto.subtle.exportKey('spki',kp.publicKey),priv=await crypto.subtle.exportKey('pkcs8',kp.privateKey);
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const encPriv=await crypto.subtle.encrypt({name:'AES-GCM',iv},wk,priv);
    try{await st('accounts','readwrite',s=>s.add({name,salt,hash,pub,encPriv,iv,created:Date.now()}))}
    catch(e){if(e&&e.name=='ConstraintError')throw new Error('Name bereits vergeben');throw e}
    return{name,priv:kp.privateKey,pub:kp.publicKey};
  },
  async login(name,pw){
    const fail=new Error('Name oder Passwort falsch');
    const a=await st('accounts','readonly',s=>s.get(String(name).trim().toLowerCase()));if(!a)throw fail;
    const d=await Cr.derive(pw,a.salt);let diff=0;for(let i=0;i<32;i++)diff|=d[i]^a.hash[i];if(diff)throw fail;
    const wk=await crypto.subtle.importKey('raw',d.slice(32),'AES-GCM',false,['decrypt']);
    const pk=await crypto.subtle.decrypt({name:'AES-GCM',iv:a.iv},wk,a.encPriv);
    return{name:a.name,
      priv:await crypto.subtle.importKey('pkcs8',pk,{name:'RSA-OAEP',hash:'SHA-256'},false,['decrypt']),
      pub:await crypto.subtle.importKey('spki',a.pub,{name:'RSA-OAEP',hash:'SHA-256'},false,['encrypt'])};
  },
  async pubOf(name){const a=await st('accounts','readonly',s=>s.get(String(name).trim().toLowerCase()));return a?crypto.subtle.importKey('spki',a.pub,{name:'RSA-OAEP',hash:'SHA-256'},false,['encrypt']):null},
  /* Hybrid-Verschlüsselung: AES-256-GCM pro Nachricht, Schlüssel mit RSA-OAEP für den Empfänger */
  async seal(obj,pubKey){
    const k=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt']);
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,enc.encode(JSON.stringify(obj)));
    const wk=await crypto.subtle.encrypt({name:'RSA-OAEP'},pubKey,await crypto.subtle.exportKey('raw',k));
    return{iv,ct,wk};
  },
  async open(rec,priv){
    const raw=await crypto.subtle.decrypt({name:'RSA-OAEP'},priv,rec.wk);
    const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
    return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:rec.iv},k,rec.ct)));
  }
};
/*CR-END*/

  function auth(mode){authUI(el,mode,list)}

    for(const k in NM){const b=document.createElement('button');b.className=k==folder?'b':'g';b.textContent=NM[k]+(k=='inbox'&&unread?' ('+unread+')':'');b.onclick=()=>{folder=k;list()};$('#tb').appendChild(b)}
    $('#nw').onclick=()=>compose();

      d.innerHTML='<div class="av">'+esc((who[0]||'?').toUpperCase())+'</div><div style="flex:1;min-width:0;'+(r.read||folder!='inbox'?'':'font-weight:700')+'"><div style="display:flex;justify-content:space-between;gap:6px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(out?'An: ':'')+esc(who)+'</span><span style="opacity:.5;font-size:12px;font-weight:400">'+fmt(r.date)+'</span></div><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(m.subject||'(kein Betreff)')+'</div><div style="opacity:.5;font-size:13px;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc((m.body||'').slice(0,60))+'</div></div>';

  }

  async function deliver(v){
    const me=Sys.session;let to=v.to.trim().toLowerCase();
    const parts=to.split('@');if(parts.length>2||!parts[0])throw new Error('Ungültige Empfängeradresse');

Cr.changePassword=async function(name,oldPw,newPw){
  name=String(name).trim().toLowerCase();const fail=new Error('Name oder aktuelles Passwort falsch');
  const a=await st('accounts','readonly',s=>s.get(name));if(!a)throw fail;
  const d=await Cr.derive(oldPw,a.salt);let diff=0;for(let i=0;i<32;i++)diff|=d[i]^a.hash[i];if(diff)throw fail;
  if(newPw.length<8)throw new Error('Das neue Passwort braucht mindestens 8 Zeichen');
  if(pwScore(newPw)<2)throw new Error('Neues Passwort zu schwach – mische Buchstaben, Zahlen oder Sonderzeichen');
  const wk=await crypto.subtle.importKey('raw',d.slice(32),'AES-GCM',false,['decrypt']);
  const pk=await crypto.subtle.decrypt({name:'AES-GCM',iv:a.iv},wk,a.encPriv);
  const salt=crypto.getRandomValues(new Uint8Array(16)),n=await Cr.derive(newPw,salt);
  const nk=await crypto.subtle.importKey('raw',n.slice(32),'AES-GCM',false,['encrypt']),iv=crypto.getRandomValues(new Uint8Array(12));
  a.salt=salt;a.hash=n.slice(0,32);a.iv=iv;a.encPriv=await crypto.subtle.encrypt({name:'AES-GCM',iv},nk,pk);a.pwChanged=Date.now();
  await st('accounts','readwrite',s=>s.put(a));
};
Cr.deleteAccount=async function(name,pw){
  await Cr.login(name,pw);name=String(name).trim().toLowerCase();
  for(const store of ['mails','msgs']){
    const all=await st(store,'readonly',s=>s.getAll());
    for(const r of all)if(r.owner===name)await st(store,'readwrite',s=>s.delete(r.id));
  }
  await st('accounts','readwrite',s=>s.delete(name));
};
